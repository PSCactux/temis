<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aroa Assistant</title>
<style>
  :root {
    --bg:#f3f2ee; --panel:#ffffff; --raised:#faf9f6; --ink:#1c1c1a; --ink-2:#4a4945; --muted:#7a7872; --line:#e4e2db; --line-2:#d4d1c8;
    --accent:#245c4d; --accent-ink:#ffffff; --accent-soft:#e3efea; --warn:#9a5b00; --warn-soft:#fbf1dd; --bad:#9b2c2c; --bad-soft:#f9e4e4; --ok:#2f7a47; --mark:#fff1a8;
    --shadow:0 1px 2px rgba(0,0,0,.05), 0 8px 24px -12px rgba(0,0,0,.12);
    --mono:ui-monospace, "SF Mono", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg:#121211; --panel:#1a1a18; --raised:#212120; --ink:#ecebe6; --ink-2:#c6c4bc; --muted:#8f8d85; --line:#2b2b28; --line-2:#3a3a36;
    --accent:#7fc0a8; --accent-ink:#0f1f1a; --accent-soft:#1d2f29; --warn:#e2a650; --warn-soft:#2d2415; --bad:#e58585; --bad-soft:#331c1c; --ok:#86cc97; --mark:#5a4d12;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
  } }
  :root[data-theme="dark"] {
    --bg:#121211; --panel:#1a1a18; --raised:#212120; --ink:#ecebe6; --ink-2:#c6c4bc; --muted:#8f8d85; --line:#2b2b28; --line-2:#3a3a36;
    --accent:#7fc0a8; --accent-ink:#0f1f1a; --accent-soft:#1d2f29; --warn:#e2a650; --warn-soft:#2d2415; --bad:#e58585; --bad-soft:#331c1c; --ok:#86cc97; --mark:#5a4d12;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
  }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; font:15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif; background:var(--bg); color:var(--ink); display:grid; grid-template-columns:292px 1fr; -webkit-font-smoothing:antialiased; }
  a { color:var(--accent); text-decoration:none; }
  button { font:inherit; color:inherit; background:none; border:0; cursor:pointer; }
  button:disabled { opacity:.45; cursor:default; }
  .btn { display:inline-flex; align-items:center; gap:8px; border:1px solid var(--line-2); background:var(--panel); border-radius:10px; padding:8px 12px; font-weight:500; font-size:14px; transition:background .15s, border-color .15s; }
  .btn:hover { background:var(--raised); border-color:var(--muted); }
  .btn.primary { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
  .btn.primary:hover { filter:brightness(1.08); }
  .btn.ghost { border-color:transparent; color:var(--ink-2); padding:6px 8px; }
  .btn.ghost:hover { background:var(--raised); border-color:transparent; color:var(--ink); }
  .btn svg, .icon svg { width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }

  /* ── sidebar ─────────────────────────────────────────── */
  aside { display:flex; flex-direction:column; min-height:0; background:var(--panel); border-right:1px solid var(--line); }
  .brand { padding:22px 20px 14px; display:flex; align-items:center; gap:12px; }
  .mono { width:36px; height:36px; border-radius:10px; background:var(--accent); color:var(--accent-ink); display:grid; place-items:center; font-weight:700; font-size:17px; }
  .brand h1 { font-size:17px; margin:0; font-weight:650; letter-spacing:-.01em; }
  .brand .tag { font-size:12px; color:var(--muted); margin-top:1px; }
  .side-actions { padding:0 16px 10px; }
  .side-actions .btn { width:100%; justify-content:center; }
  .section { padding:14px 20px 6px; font-size:11px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); display:flex; justify-content:space-between; align-items:center; }
  .section .btn { padding:2px 6px; font-size:12px; letter-spacing:0; text-transform:none; font-weight:500; }
  .scroll { flex:1; min-height:0; overflow:auto; }
  .threads, .docs { list-style:none; margin:0; padding:0 10px; }
  .threads li { padding:9px 10px; border-radius:10px; cursor:pointer; display:grid; gap:2px; }
  .threads li:hover { background:var(--raised); }
  .threads li.active { background:var(--accent-soft); }
  .threads .t { font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .threads .m { font-size:12px; color:var(--muted); display:flex; gap:8px; align-items:center; }
  .chip { display:inline-block; font-size:11px; font-weight:600; padding:1px 7px; border-radius:999px; background:var(--accent-soft); color:var(--accent); font-family:var(--mono); }
  .docs li { padding:7px 10px; border-radius:10px; display:flex; align-items:center; gap:8px; font-size:13px; cursor:pointer; }
  .docs li.on { background:var(--accent-soft); }
  .docs input { margin:0; accent-color:var(--accent); flex:none; }
  .sel { display:inline-flex; align-items:center; gap:6px; font-size:12px; color:var(--accent); background:var(--accent-soft); border-radius:999px; padding:3px 10px; }
  .sel button { color:inherit; opacity:.7; padding:0 2px; }
  .sel[hidden] { display:none; }
  .sel button:hover { opacity:1; }
  .docs li:hover { background:var(--raised); }
  .docs .t { flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .docs .n { font-size:11px; color:var(--muted); font-family:var(--mono); }
  .docs .x { color:var(--muted); padding:0 4px; border-radius:6px; visibility:hidden; }
  .docs li:hover .x { visibility:visible; }
  .docs .x:hover { color:var(--bad); background:var(--bad-soft); }
  .docs .an { color:var(--muted); padding:0 4px; border-radius:6px; visibility:hidden; font-size:12px; }
  .docs li:hover .an { visibility:visible; }
  .docs .an:hover { color:var(--accent); background:var(--accent-soft); }
  .reader .rb.report { white-space:normal; }
  .reader .rb.report h1 { font-size:17px; margin:0 0 10px; }
  .reader .rb.report h2 { font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--accent); margin:16px 0 6px; }
  .reader .rb.report blockquote { margin:2px 0 8px; padding:4px 10px; border-left:3px solid var(--line-2); color:var(--ink-2); font-size:13px; }
  .reader .rb.report .cite { font-family:var(--mono); font-size:12px; color:var(--accent); font-weight:600; padding:0 3px; border-radius:4px; }
  .reader .rb.report .cite.link:hover { background:var(--accent-soft); text-decoration:underline; }
  .docs li.job { cursor:default; display:grid; gap:4px; }
  .docs .job .t { font-size:12.5px; }
  .bar { height:4px; border-radius:2px; background:var(--line); overflow:hidden; }
  .bar i { display:block; height:100%; width:0; background:var(--accent); transition:width .2s; }
  .bar.busy i { width:40%; animation:slide 1.1s ease-in-out infinite; }
  @keyframes slide { 0% { margin-left:-40%; } 100% { margin-left:100%; } }
  .empty-side { padding:6px 20px 10px; font-size:13px; color:var(--muted); }
  .side-foot { border-top:1px solid var(--line); padding:12px 16px 14px; display:grid; gap:10px; }
  .tiles { display:grid; grid-template-columns:repeat(3, 1fr); gap:6px; }
  .tile { background:var(--raised); border:1px solid var(--line); border-radius:10px; padding:7px 9px; min-width:0; overflow:hidden; }
  .tile b { display:block; font-size:15px; font-weight:650; font-variant-numeric:tabular-nums; }
  .tile span { font-size:11px; color:var(--muted); white-space:nowrap; display:block; overflow:hidden; text-overflow:ellipsis; }
  .status { font-size:12px; color:var(--muted); display:flex; flex-wrap:wrap; gap:4px 10px; align-items:center; }
  .dot { width:7px; height:7px; border-radius:50%; background:var(--ok); display:inline-block; margin-right:5px; }
  .links { display:flex; gap:12px; font-size:12px; align-items:center; }
  .links a { color:var(--ink-2); }
  .links a:hover { color:var(--accent); }
  .links .lang { margin-left:auto; font-size:12px; color:var(--ink-2); border:1px solid var(--line-2); border-radius:999px; padding:2px 9px; }
  .links .lang b { color:var(--accent); }

  /* ── main ────────────────────────────────────────────── */
  main { display:flex; flex-direction:column; min-width:0; min-height:0; position:relative; }
  .topbar { display:flex; align-items:center; gap:14px; padding:12px 24px; border-bottom:1px solid var(--line); background:var(--panel); }
  .topbar .title { flex:1; font-weight:600; font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .matter { display:flex; align-items:center; gap:8px; font-size:13px; color:var(--muted); }
  .matter input { width:150px; font:inherit; font-family:var(--mono); font-size:13px; padding:6px 10px; border:1px solid var(--line-2); border-radius:8px; background:var(--bg); color:var(--ink); }
  .matter input:focus { outline:2px solid var(--accent); outline-offset:-1px; border-color:transparent; }
  #menu { display:none; }
  .body-wrap { flex:1; min-height:0; display:flex; }
  .chat { flex:1; min-width:0; display:flex; flex-direction:column; }

  #log { flex:1; overflow:auto; padding:28px 24px 12px; }
  .column { max-width:820px; margin:0 auto; display:flex; flex-direction:column; gap:22px; }

  .welcome { margin:8vh auto 0; max-width:680px; text-align:center; }
  .welcome h2 { font-size:26px; font-weight:650; letter-spacing:-.02em; margin:0 0 6px; }
  .welcome p { color:var(--muted); margin:0 0 22px; }
  .suggest { display:grid; grid-template-columns:repeat(2, 1fr); gap:10px; text-align:left; }
  .suggest button { border:1px solid var(--line); background:var(--panel); border-radius:12px; padding:12px 14px; font-size:14px; line-height:1.4; transition:border-color .15s, transform .15s; }
  .suggest button:hover { border-color:var(--accent); transform:translateY(-1px); }
  .suggest button b { display:block; font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.06em; color:var(--accent); margin-bottom:3px; }

  .row { display:flex; gap:12px; }
  .row.user { justify-content:flex-end; }
  .row.user .bubble { max-width:72%; background:var(--accent-soft); color:var(--ink); padding:11px 15px; border-radius:18px 18px 4px 18px; white-space:pre-wrap; overflow-wrap:anywhere; }
  .row.notice { justify-content:center; }
  .row.notice .bubble { font-size:13px; color:var(--warn); background:var(--warn-soft); padding:6px 12px; border-radius:999px; }
  .files { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .file { display:inline-flex; align-items:center; gap:6px; font-size:12.5px; padding:4px 10px; border-radius:999px; background:var(--panel); border:1px solid var(--line-2); color:var(--ink-2); }
  .avatar { flex:none; width:30px; height:30px; border-radius:9px; background:var(--accent); color:var(--accent-ink); display:grid; place-items:center; font-weight:700; font-size:13px; margin-top:2px; }
  .answer { flex:1; min-width:0; }
  .answer .head { display:flex; align-items:center; gap:8px; font-size:13px; color:var(--muted); margin-bottom:4px; }
  .answer .head b { color:var(--ink); font-weight:600; }
  .kind { font-size:11px; font-weight:600; letter-spacing:.04em; text-transform:uppercase; padding:1px 7px; border-radius:999px; background:var(--raised); border:1px solid var(--line); color:var(--ink-2); }
  .kind.blocked { color:var(--bad); background:var(--bad-soft); border-color:transparent; }
  .kind.question { color:var(--warn); background:var(--warn-soft); border-color:transparent; }
  .kind.ok { color:var(--ok); background:var(--accent-soft); border-color:transparent; }
  .kind.fail { color:var(--bad); background:var(--bad-soft); border-color:transparent; }
  .body { overflow-wrap:anywhere; }
  .body p { margin:0 0 10px; } .body p:last-child { margin-bottom:0; }
  .body ul, .body ol { margin:4px 0 10px; padding-left:22px; }
  .body li { margin:2px 0; }
  .body h3 { font-size:15px; margin:12px 0 6px; font-weight:650; }
  .body blockquote { margin:6px 0 10px; padding:6px 14px; border-left:3px solid var(--accent); background:var(--raised); border-radius:0 8px 8px 0; color:var(--ink-2); }
  .body code { font-family:var(--mono); font-size:13px; background:var(--raised); border:1px solid var(--line); border-radius:5px; padding:1px 5px; }
  .body pre { background:var(--raised); border:1px solid var(--line); border-radius:10px; padding:12px 14px; overflow:auto; font-size:13px; }
  .body pre code { border:0; background:none; padding:0; }
  .body .cite { font-family:var(--mono); font-size:12px; color:var(--accent); font-weight:600; padding:0 3px; border-radius:4px; }
  .body .cite.link:hover { background:var(--accent-soft); text-decoration:underline; }
  .body a { text-decoration:underline; text-decoration-color:var(--line-2); }
  .question-card { border:1px solid var(--warn); background:var(--warn-soft); border-radius:12px; padding:12px 14px; }
  .question-card .lbl { font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.06em; color:var(--warn); margin-bottom:4px; }

  .live { display:flex; align-items:center; gap:10px; font-size:13px; color:var(--muted); margin:6px 0 2px; }
  .spinner { width:14px; height:14px; border:2px solid var(--line-2); border-top-color:var(--accent); border-radius:50%; animation:spin .8s linear infinite; flex:none; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .live .crumbs span + span::before { content:"›"; margin:0 6px; color:var(--line-2); }

  .actions { display:flex; align-items:center; gap:4px; margin-top:6px; opacity:.75; transition:opacity .15s; }
  .answer:hover .actions { opacity:1; }
  .actions .btn.ghost { font-size:12.5px; }
  .actions .fb.on { color:var(--accent); background:var(--accent-soft); }

  .path { margin-top:8px; border:1px solid var(--line); background:var(--panel); border-radius:12px; padding:14px 16px; display:none; box-shadow:var(--shadow); }
  .path.open { display:block; }
  .path .sum { display:flex; flex-wrap:wrap; gap:6px 14px; font-size:12.5px; color:var(--ink-2); padding-bottom:10px; margin-bottom:10px; border-bottom:1px solid var(--line); }
  .path .sum b { color:var(--ink); font-variant-numeric:tabular-nums; }
  .step { position:relative; padding:0 0 12px 22px; font-size:13.5px; }
  .step::before { content:""; position:absolute; left:5px; top:7px; width:8px; height:8px; border-radius:50%; background:var(--accent); }
  .step::after { content:""; position:absolute; left:8.5px; top:17px; bottom:-2px; width:1px; background:var(--line-2); }
  .step:last-child::after { display:none; }
  .step .st { font-weight:600; }
  .step .st small { color:var(--muted); font-weight:400; margin-left:6px; font-variant-numeric:tabular-nums; }
  .step .sm { color:var(--ink-2); }
  .step .items { margin:4px 0 0; padding:0; list-style:none; font-size:12.5px; color:var(--muted); }
  .step .items li { padding:1px 0 1px 10px; border-left:2px solid var(--line); margin:2px 0; overflow-wrap:anywhere; }
  .step.bad::before { background:var(--bad); }
  .step.bad .sm { color:var(--bad); }
  .step.audit::before { background:var(--muted); }

  /* ── reader ───────────────────────────────────────────── */
  .reader { width:0; flex:none; border-left:1px solid var(--line); background:var(--panel); display:flex; flex-direction:column; overflow:hidden; transition:width .2s; }
  .reader.open { width:min(460px, 45%); }
  .reader .rh { display:flex; align-items:center; gap:8px; padding:12px 14px 12px 18px; border-bottom:1px solid var(--line); }
  .reader .rh .t { flex:1; font-weight:600; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .reader .rh small { display:block; color:var(--muted); font-weight:400; font-size:12px; font-family:var(--mono); }
  .reader .rb { flex:1; overflow:auto; padding:18px; font-size:13.5px; line-height:1.6; white-space:pre-wrap; overflow-wrap:anywhere; }
  .reader mark { background:var(--mark); color:inherit; border-radius:3px; padding:1px 2px; }
  .reader.open.wide { width:min(820px, 62%); }
  .reader .rh .back { margin-left:auto; font-size:12px; }
  .reader .rb.review { white-space:normal; }
  .rv-sum { font-size:13px; color:var(--ink-2); margin-bottom:8px; } .rv-sum .e { color:var(--bad); } .rv-sum .w { color:var(--warn); }
  .rv-note { font-size:12.5px; color:var(--muted); font-style:italic; margin:4px 0; } .rv-note.ok { color:var(--ok); font-style:normal; }
  .rv-acts { display:flex; gap:8px; margin:10px 0 14px; flex-wrap:wrap; }
  .issue { border:1px solid var(--line); border-left:3px solid var(--warn); border-radius:8px; padding:8px 10px; margin:0 0 8px; font-size:13px; cursor:pointer; background:var(--panel); }
  .issue.err { border-left-color:var(--bad); }
  .issue.accept { background:var(--accent-soft); } .issue.reject { opacity:.55; }
  .issue .ih { display:flex; gap:8px; align-items:baseline; font-size:12px; color:var(--muted); flex-wrap:wrap; } .issue .num { font-family:var(--mono); color:var(--accent); font-weight:600; } .issue .kind { font-weight:600; color:var(--ink); }
  .issue .why { margin:4px 0; }
  .issue blockquote { margin:4px 0; padding:2px 8px; border-left:2px solid var(--line-2); color:var(--ink-2); font-size:12.5px; }
  .issue .orig, .issue .chg { font-size:12.5px; color:var(--ink-2); margin:4px 0; } .issue .chg { color:var(--accent); }
  .issue .src { font-family:var(--mono); font-size:11.5px; word-break:break-all; display:block; margin-top:2px; }
  .issue .acts { display:flex; gap:6px; margin-top:6px; } .issue .acts button { font:inherit; font-size:12px; padding:3px 10px; border-radius:6px; border:1px solid var(--line-2); background:var(--panel); color:var(--ink); cursor:pointer; }
  .issue.accept .acts [data-dec=accept], .issue.reject .acts [data-dec=reject] { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
  .rv-draft { white-space:pre-wrap; border-top:1px solid var(--line); padding-top:14px; margin-top:14px; }
  .rv-draft mark.iss { background:var(--warn-soft); border-bottom:2px solid var(--warn); cursor:pointer; } .rv-draft mark.iss.err { background:var(--bad-soft); border-bottom-color:var(--bad); }
  .clip { position:absolute; z-index:6; display:none; }
  .clip.show { display:inline-flex; }

  /* ── composer ─────────────────────────────────────────── */
  .composer { padding:10px 24px 18px; background:linear-gradient(to top, var(--bg) 70%, transparent); }
  .composer form { max-width:820px; margin:0 auto; background:var(--panel); border:1px solid var(--line-2); border-radius:16px; padding:8px 8px 8px 10px; box-shadow:var(--shadow); }
  .composer form:focus-within { border-color:var(--accent); }
  .attach-list { display:flex; flex-wrap:wrap; gap:6px; padding:2px 4px 8px; }
  .attach-list:empty { display:none; }
  .att { display:inline-flex; align-items:center; gap:8px; font-size:12.5px; padding:5px 8px 5px 10px; border-radius:10px; background:var(--raised); border:1px solid var(--line); }
  .att .nm { max-width:200px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .att .sz { color:var(--muted); font-family:var(--mono); font-size:11px; }
  .att label { display:inline-flex; align-items:center; gap:4px; color:var(--ink-2); cursor:pointer; }
  .att input { margin:0; accent-color:var(--accent); }
  .att .x { color:var(--muted); padding:0 3px; border-radius:5px; }
  .att .x:hover { color:var(--bad); background:var(--bad-soft); }
  .att .spinner { width:11px; height:11px; }
  .line { display:flex; align-items:flex-end; gap:6px; }
  textarea { flex:1; resize:none; border:0; background:none; color:var(--ink); font:inherit; line-height:1.5; max-height:200px; padding:8px 4px; outline:none; }
  textarea::placeholder { color:var(--muted); }
  .icon { width:38px; height:38px; border-radius:11px; display:grid; place-items:center; flex:none; color:var(--muted); }
  .icon:hover { background:var(--raised); color:var(--ink); }
  .icon svg { width:18px; height:18px; }
  .send { width:38px; height:38px; border-radius:11px; background:var(--accent); color:var(--accent-ink); display:grid; place-items:center; flex:none; }
  .send svg { width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  .hint { max-width:820px; margin:8px auto 0; font-size:12px; color:var(--muted); text-align:center; }

  .drop { position:absolute; inset:0; display:none; place-items:center; background:color-mix(in srgb, var(--bg) 80%, transparent); border:2px dashed var(--accent); z-index:10; font-weight:600; color:var(--accent); font-size:17px; backdrop-filter:blur(2px); }
  main.dragging .drop { display:grid; }
  .toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:9px 16px; border-radius:999px; font-size:13px; box-shadow:var(--shadow); opacity:0; transition:opacity .2s; pointer-events:none; z-index:20; }
  .toast.show { opacity:1; }

  @media (max-width: 860px) {
    body { grid-template-columns:1fr; }
    aside { position:fixed; inset:0 25% 0 0; z-index:30; transform:translateX(-100%); transition:transform .2s; box-shadow:var(--shadow); }
    aside.open { transform:none; }
    #menu { display:inline-flex; }
    .topbar { padding:10px 16px; }
    .matter input { width:110px; }
    #log { padding:20px 16px 8px; }
    .suggest { grid-template-columns:1fr; }

$('#lang').onclick = () => { lang = lang === 'es' ? 'en' : 'es'; try { localStorage.setItem('aroa.lang', lang); } catch {} applyLang(); if (thread && !column.querySelector('.welcome')) openThread(thread); };

/* ── helpers ───────────────────────────────────────────── */
function id() { return Math.random().toString(36).slice(2, 10); }
function esc(s) { return String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function ago(ts) {
  const d = (Date.now() - new Date(ts)) / 1000;
  if (d < 60) return lang === 'es' ? 'ahora' : 'now'; if (d < 3600) return Math.round(d / 60) + ' min'; if (d < 86400) return Math.round(d / 3600) + ' h';
  return new Date(ts).toLocaleDateString(lang, { day: 'numeric', month: 'short' });
}
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2600); }
function kchars(n) { return n >= 1000 ? (n / 1000).toFixed(1) + 'k' : String(n); }

function inline(s) {
  return esc(s)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
    .replace(/(^|[\s(])_(.+?)_(?=[\s).,;:]|$)/g, '$1<i>$2</i>')
    .replace(/\[(\d+(?:\s*,\s*\d+)*)\]/g, (_, list) => list.split(/\s*,\s*/).map(n => `<button type="button" class="cite" data-n="${n}">[${n}]</button>`).join(''))
    .replace(/(https?:\/\/[^\s<)]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
}
function md(text) {
  const lines = String(text ?? '').replace(/\r/g, '').split('\n');
  let html = '', para = [], list = null, code = null;
  const flush = () => { if (para.length) { html += '<p>' + inline(para.join(' ')) + '</p>'; para = []; } if (list) { html += `</${list}>`; list = null; } };
  for (const raw of lines) {
    if (code !== null) { if (raw.startsWith('```')) { html += '<pre><code>' + esc(code.join('\n')) + '</code></pre>'; code = null; } else code.push(raw); continue; }
    const line = raw.trimEnd();
    if (line.startsWith('```')) { flush(); code = []; continue; }
    if (!line.trim()) { flush(); continue; }
    let m;
    if ((m = /^#{1,3}\s+(.*)/.exec(line))) { flush(); html += '<h3>' + inline(m[1]) + '</h3>'; continue; }
    if ((m = /^\s*>\s?(.*)/.exec(line))) { flush(); html += '<blockquote>' + inline(m[1]) + '</blockquote>'; continue; }
    if ((m = /^\s*[-*•]\s+(.*)/.exec(line))) { if (list !== 'ul') { flush(); list = 'ul'; html += '<ul>'; } html += '<li>' + inline(m[1]) + '</li>'; continue; }
    if ((m = /^\s*\d+[.)]\s+(.*)/.exec(line))) { if (list !== 'ol') { flush(); list = 'ol'; html += '<ol>'; } html += '<li>' + inline(m[1]) + '</li>'; continue; }
    if (list) flush();
    para.push(line);
  }
  flush();
  return html || '<p></p>';
}

/* ── rendering ─────────────────────────────────────────── */
function scrollDown() { log.scrollTop = log.scrollHeight; }
const ATTACHED = /\n\n<attachment name="([^"\n]+)">\n/g;

function addUser(text) {
  const el = document.createElement('div');
  if (text.startsWith('[Alarm due now]')) { el.className = 'row notice'; el.innerHTML = `<div class="bubble">⏰ ${esc(text.replace('[Alarm due now]', '').trim())}</div>`; }
  else {
    const names = [...text.matchAll(ATTACHED)].map(m => m[1]);
    const shown = names.length ? text.slice(0, text.search(ATTACHED)) : text;
    el.className = 'row user';
    el.innerHTML = `<div class="bubble">${esc(shown)}${names.length ? '<div class="files">' + names.map(n => `<span class="file">📎 ${esc(n)}</span>`).join('') + '</div>' : ''}</div>`;
  }
  column.appendChild(el); scrollDown(); return el;
}

function kindTag(m) {
  const k = m.kind || '';
  if (k === 'blocked') return `<span class="kind blocked">${T('k_blocked')}</span>`;
  if (k === 'question') return `<span class="kind question">${T('k_question')}</span>`;
  if (k === 'abstain') return `<span class="kind">${T('k_abstain')}</span>`;
  let tag = k ? `<span class="kind">${esc(T('kinds')[k] || k)}</span>` : '';
  if (m.verified === true) tag += `<span class="kind ok">${T('k_verified')}</span>`;
  if (m.verified === false) tag += `<span class="kind fail">${T('k_unverified')}</span>`;
  return tag;
}

function addAssistant(text, m = {}) {
  const el = document.createElement('div'); el.className = 'row';
  const body = m.kind === 'question' ? `<div class="question-card"><div class="lbl">${T('asking')}</div>${md(text)}</div>` : md(text);
  el.innerHTML = `<div class="avatar">A</div><div class="answer"><div class="head"><b>Aroa</b>${kindTag(m)}</div><div class="body">${body}</div>` +
    (m.turn_id ? `<div class="actions"><button class="btn ghost" data-path="${esc(m.turn_id)}"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h10M4 18h7"/></svg>${T('path')}</button>` +
      `<button class="btn ghost fb" data-fb="1" data-turn="${esc(m.turn_id)}" title="${T('good')}">👍</button><button class="btn ghost fb" data-fb="-1" data-turn="${esc(m.turn_id)}" title="${T('bad')}">👎</button></div><div class="path" id="path-${esc(m.turn_id)}"></div>` : '') + '</div>';
  const sources = Array.isArray(m.sources) ? m.sources : [];
  el.querySelector('.answer').dataset.sources = JSON.stringify(sources);
  if (sources.length) el.querySelectorAll('.cite').forEach(c => { if (sources.some(s => s.n === +c.dataset.n)) c.classList.add('link'); });
  column.appendChild(el); scrollDown(); return el;
}

function addLive() {
  const el = document.createElement('div'); el.className = 'row';
  el.innerHTML = `<div class="avatar">A</div><div class="answer"><div class="head"><b>Aroa</b></div><div class="live"><div class="spinner"></div><div class="crumbs"><span>${T('thinking')}</span></div></div><div class="body"></div></div>`;
  column.appendChild(el); scrollDown(); return el;
}

function renderPath(t) {
  const fmt = n => (n ?? 0).toLocaleString(lang);
  let html = `<div class="sum"><span>${T('route')} <b>${esc(t.route || '')}</b></span><span><b>${t.seconds}</b> s</span><span><b>${t.llm_calls}</b> ${T('model_calls_long')}</span>` +
    `<span><b>${fmt(t.input_tokens)}</b> in · <b>${fmt(t.output_tokens)}</b> out</span><span><b>${t.tool_calls}</b> ${T('tools')}</span>` +
    (t.claims ? `<span>${T('claims')} <b>${t.claims - t.claims_failed}/${t.claims}</b></span>` : '') + (t.facts_written ? `<span><b>${t.facts_written}</b> ${T('facts_stored')}</span>` : '') + '</div>';
  for (const s of t.trace || []) {
    const bad = /blocked|unproven|problems|FAILED|None of|Bloqueado|sin probar|Problemas|FALLÓ|Ninguno/i.test(s.summary);
    html += `<div class="step${bad ? ' bad' : ''}"><div class="st">${esc(s.title)}${t.nodes && t.nodes[s.step] != null ? `<small>${t.nodes[s.step]} s</small>` : ''}</div><div class="sm">${esc(s.summary)}</div>` +
      (s.items && s.items.length ? '<ul class="items">' + s.items.map(i => `<li>${esc(i)}</li>`).join('') + '</ul>' : '') + '</div>';
  }
  const a = t.audit || {};
  if (a.tool_calls && a.tool_calls.length) {
    html += `<div class="step audit"><div class="st">${T('audit_tools')}</div><ul class="items">` + a.tool_calls.map(c => `<li>${c.ok ? 'ok' : 'FAILED'} · <b>${esc(c.tool)}</b> ${esc(c.arguments)} · ${c.seconds} s · ${esc(c.result_hash)}</li>`).join('') + '</ul></div>';
  }
  if (a.memory_writes && a.memory_writes.length) {
    html += `<div class="step audit"><div class="st">${T('audit_memory')}</div><ul class="items">` + a.memory_writes.map(w => `<li>${w.stored ? T('stored') : T('duplicate')} · ${esc(w.text)}</li>`).join('') + '</ul></div>';
  }
  if (t.feedback) html += `<div class="step audit"><div class="st">${T('feedback')}</div><div class="sm">${t.feedback.score > 0 ? '👍' : '👎'} ${esc(t.feedback.comment || '')}</div></div>`;
  return html;
}

  column.innerHTML = `<div class="welcome"><h2>${T('welcome')}</h2><p>${T('welcome_p')}</p>` +
    `<div class="suggest">${T('suggestions').map(([k, q]) => `<button type="button" data-q="${esc(q)}"><b>${esc(k)}</b>${esc(q)}</button>`).join('')}</div></div>`;
}

/* ── reader ────────────────────────────────────────────── */
async function openReader(source, quote) {
  const reader = $('#reader');
  const r = await fetch('/api/documents/' + encodeURIComponent(source) + '/text');
  if (!r.ok) { toast(T('not_removed')); return; }
  const d = await r.json();
  const doc = docsCache.find(x => x.source === source);
  readerSource = source;
  $('#reader-title').innerHTML = `${esc(doc ? doc.title : source)}<small>${esc(source)}</small>`;
  let html = esc(d.text), target = null;
  if (quote) {
    const needle = quote.replace(/\s+/g, ' ').trim();
    const probe = needle.length > 60 ? needle.slice(0, 60) : needle;
    const idx = d.text.replace(/\s+/g, ' ').indexOf(probe);
    if (idx >= 0) {
      // map the index in the whitespace-collapsed text back to the original
      let i = 0, j = 0; const txt = d.text;
      while (j < idx && i < txt.length) { if (/\s/.test(txt[i]) && i > 0 && /\s/.test(txt[i - 1])) { i++; continue; } i++; j++; }
      while (i < txt.length && /\s/.test(txt[i]) && i > 0 && /\s/.test(txt[i - 1])) i++;
      let end = i, k = 0; while (end < txt.length && k < needle.length) { if (!(/\s/.test(txt[end]) && end > 0 && /\s/.test(txt[end - 1]))) k++; end++; }
      html = esc(txt.slice(0, i)) + '<mark id="mark">' + esc(txt.slice(i, end)) + '</mark>' + esc(txt.slice(end));
      target = true;
    }
  }
  $('#reader-body').className = 'rb'; $('#reader-body').innerHTML = html;
  reader.classList.remove('wide'); reader.classList.add('open');
  if (reviewState) $('#reader-title').insertAdjacentHTML('beforeend', `<button type="button" class="btn ghost back" id="rv-back">${T('back_review')}</button>`);
  if (target) setTimeout(() => $('#mark')?.scrollIntoView({ block: 'center', behavior: 'smooth' }), 220); else $('#reader-body').scrollTop = 0;
}
$('#reader-close').onclick = () => $('#reader').classList.remove('open', 'wide');

let readerSource = null;
function clipButton() {
  const sel = window.getSelection(), btn = $('#clip'), body = $('#reader-body');
  const text = sel && !sel.isCollapsed ? sel.toString().trim() : '';
  if (!text || !readerSource || body.classList.contains('report') || body.classList.contains('review') || !body.contains(sel.anchorNode)) { btn.classList.remove('show'); return; }
  const rect = sel.getRangeAt(0).getBoundingClientRect(), host = $('#reader').getBoundingClientRect();
  btn.style.left = Math.max(8, rect.left - host.left) + 'px'; btn.style.top = (rect.bottom - host.top + 6) + 'px';
  btn.dataset.text = text; btn.classList.add('show');
}
document.addEventListener('selectionchange', () => setTimeout(clipButton, 0));
$('#clip').addEventListener('mousedown', e => e.preventDefault());  // keep the selection
$('#clip').onclick = async () => {
  const text = $('#clip').dataset.text; if (!text) return;
  const note = prompt(T('clip_note'), ''); if (note === null) return;
  const r = await fetch('/api/clippings', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ source: readerSource, text, note, matter: $('#matter').value.trim() }) });
  $('#clip').classList.remove('show'); window.getSelection()?.removeAllRanges();
  toast(r.ok ? T('clipped') : T('not_removed')); loadDocs(); loadHealth();
};

function showReport(job) {
  const r = job.result, body = $('#reader-body');
  $('#reader-title').innerHTML = `${esc(r.title)}<small>${esc(r.source)} · ${r.chunks} ${T('chunks')} · ${r.seconds} s</small>`;
  body.className = 'rb report';
  body.innerHTML = md(r.report);
  body.dataset.sources = JSON.stringify(r.sources || []);
  body.querySelectorAll('.cite').forEach(c => { if ((r.sources || []).some(s => s.n === +c.dataset.n)) c.classList.add('link'); });
  $('#reader').classList.remove('wide'); $('#reader').classList.add('open'); body.scrollTop = 0;
}
$('#reader-body').addEventListener('click', e => {
  const b = e.target.closest('.cite'); if (!b) return;
  const s = JSON.parse($('#reader-body').dataset.sources || '[]').find(x => x.n === +b.dataset.n);
  if (s) openReader(s.file, s.quote);
});

async function startAnalysis(source) {
  const goal = prompt(T('goal_prompt'), ''); if (goal === null) return;
  const r = await fetch('/api/documents/' + encodeURIComponent(source) + '/analyze', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ goal }) });
  if (!r.ok) { toast(T('analysis_failed')); return; }
  watchJob(source, (await r.json()).job_id, 'analysis');
}
async function startReview(req) {
  const r = await fetch('/api/reviews', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ ...req, documents: [...selected], legal: true }) });
  if (!r.ok) { toast(T('review_failed')); return; }
  watchJob(req.name || req.source, (await r.json()).job_id, 'review');
}
function watchJob(label, job_id, kind) {
  const verb = kind === 'review' ? 'reviewing' : 'analyzing';
  const li = document.createElement('li'); li.className = 'job';
  li.innerHTML = `<span class="t">${esc(label)} · <span class="st">${T(verb)}…</span></span><div class="bar busy"><i></i></div>`;
  $('#jobs').appendChild(li);
  const st = li.querySelector('.st'), bar = li.querySelector('.bar'), fill = li.querySelector('i');
  const tick = async () => {
    const job = await (await fetch('/api/jobs/' + job_id)).json();
    if (job.total) { bar.classList.remove('busy'); fill.style.width = Math.round(job.done / job.total * 100) + '%'; st.textContent = `${T(verb)} ${job.done}/${job.total}`; }
    if (job.status === 'done') { li.remove(); toast(T(kind === 'review' ? 'review_done' : 'analysis_done')); history.replaceState(null, '', '#job=' + job_id); (kind === 'review' ? showReview : showReport)(job); return; }
    if (job.status === 'failed') { li.remove(); toast(`${T(kind === 'review' ? 'review_failed' : 'analysis_failed')}: ${job.error || ''}`); return; }
    setTimeout(tick, 1500);
  };
  tick();
}

/* ── review: issues marked on the draft, changes accepted one by one ── */
let reviewState = null;
function nthIndex(text, needle, n) { let i = -1; for (let k = 0; k < n; k++) { i = text.indexOf(needle, i + 1); if (i < 0) return -1; } return i; }
function showReview(job) {
  const r = job.result, body = $('#reader-body'), reader = $('#reader');
  if (!reviewState || reviewState.job.job_id !== job.job_id) reviewState = { job, decisions: new Map() };
  $('#reader-title').innerHTML = `${esc(r.name)}<small>${r.paragraphs} ${T('paragraphs')} · ${r.quotes_checked} ${T('quotes_checked')} · ${r.citations_checked} ${T('citations_checked')} · ${r.seconds} s</small>`;
  body.className = 'rb review';
  const errs = r.issues.filter(i => i.severity === 'error').length, warns = r.issues.length - errs;
  let html = `<div class="rv-sum"><b class="e">${errs} ${T('errors')}</b> · <b class="w">${warns} ${T('warnings')}</b></div>`;
  for (const n of r.notes || []) html += `<div class="rv-note">${esc(n)}</div>`;
  if (!r.issues.length) html += `<div class="rv-note ok">${T('no_issues')}</div>`;
  html += `<div class="rv-acts"><button type="button" class="btn primary" id="rv-download">${T('download_fixed')}</button><button type="button" class="btn ghost" id="rv-copy">${T('copy_fixed')}</button><span class="rv-note" id="rv-count"></span></div>`;
  html += `<div class="rv-issues">${r.issues.map(issueCard).join('')}</div><div class="rv-draft">${markedDraft(r)}</div>`;
  body.innerHTML = html; updateCount();
  reader.classList.add('open', 'wide'); body.scrollTop = 0;
}
function issueCard(i) {
  const cut = t => esc(t.length > 240 ? t.slice(0, 240) + '…' : t), d = reviewState.decisions.get(i.n) || '';
  return `<div class="issue ${i.severity === 'error' ? 'err' : 'warn'} ${d}" data-n="${i.n}">` +
    `<div class="ih"><span class="num">[${i.n}]</span><span class="kind">${esc(T('issue_kinds')[i.kind] || i.kind)}</span><span class="par">${T('paragraph')} ${i.paragraph}</span></div>` +
    `<div class="why">${esc(i.reason)}</div><blockquote>«${cut(i.passage)}»</blockquote>` +
    (i.quote && i.kind !== 'articulo_equivocado' ? `<div class="orig">${T('original')}: «${cut(i.quote)}»${i.file ? ` <button type="button" class="cite link" data-open-src="${esc(i.file)}" data-q="${esc(i.quote)}">${T('open')}</button>` : ''}</div>` : '') +
    (i.source && /^https?:/.test(i.source) ? `<a class="src" href="${esc(i.source)}" target="_blank" rel="noopener">${esc(i.source)}</a>` : '') +
    (i.change ? `<div class="chg">${i.change.after === '' ? T('delete_paragraph') : '→ «' + esc(i.change.after) + '»'}</div><div class="acts"><button type="button" data-dec="accept">${T('accept')}</button><button type="button" data-dec="reject">${T('reject')}</button></div>` : '') + `</div>`;
}
function markedDraft(r) {
  const text = r.draft, ranges = [];
  for (const i of r.issues) { const at = nthIndex(text, i.passage, i.change ? i.change.occurrence : 1); if (at >= 0) ranges.push({ s: at, e: at + i.passage.length, i }); }
  ranges.sort((a, b) => a.s - b.s);
  let html = '', pos = 0;
  for (const g of ranges) { if (g.s < pos) continue; html += esc(text.slice(pos, g.s)) + `<mark class="iss ${g.i.severity === 'error' ? 'err' : 'warn'}" data-n="${g.i.n}" id="iss-${g.i.n}">${esc(text.slice(g.s, g.e))}</mark>`; pos = g.e; }
  return html + esc(text.slice(pos));
}
function correctedDraft(r) {
  let text = r.draft; const located = [];
  for (const i of r.issues) { if (!i.change || reviewState.decisions.get(i.n) !== 'accept') continue; const at = nthIndex(text, i.change.before, i.change.occurrence); if (at >= 0) located.push({ at, c: i.change }); }
  located.sort((a, b) => b.at - a.at);
  for (const { at, c } of located) { let end = at + c.before.length; if (c.after === '') while (end < text.length && text[end] === '\n') end++; text = text.slice(0, at) + c.after + text.slice(end); }
  return text;
}
function updateCount() { const n = [...reviewState.decisions.values()].filter(v => v === 'accept').length; const el = $('#rv-count'); if (el) el.textContent = `${n} ${T('changes')}`; }
$('#reader-body').addEventListener('click', e => {
  const body = $('#reader-body'); if (!body.classList.contains('review') || !reviewState) return;
  const r = reviewState.job.result;
  const dec = e.target.closest('[data-dec]');
  if (dec) { const card = dec.closest('.issue'); reviewState.decisions.set(+card.dataset.n, dec.dataset.dec); card.classList.remove('accept', 'reject'); card.classList.add(dec.dataset.dec); updateCount(); return; }
  const src = e.target.closest('[data-open-src]'); if (src) { openReader(src.dataset.openSrc, src.dataset.q); return; }
  if (e.target.id === 'rv-download') { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([correctedDraft(r)], { type: 'text/markdown' })); a.download = (r.name || 'borrador').replace(/\.[^.]+$/, '') + '-revisado.md'; a.click(); URL.revokeObjectURL(a.href); return; }
  if (e.target.id === 'rv-copy') { navigator.clipboard.writeText(correctedDraft(r)).then(() => toast(T('copied'))); return; }
  if (e.target.closest('a')) return;
  const card = e.target.closest('.issue'); if (card) { $('#iss-' + card.dataset.n)?.scrollIntoView({ block: 'center', behavior: 'smooth' }); return; }
  const mark = e.target.closest('mark.iss'); if (mark) body.querySelector(`.issue[data-n="${mark.dataset.n}"]`)?.scrollIntoView({ block: 'center', behavior: 'smooth' });
});
$('#reader-title').addEventListener('click', e => { if (e.target.id === 'rv-back' && reviewState) showReview(reviewState.job); });

/* ── attachments (read for this turn; optionally indexed) ── */
function renderAttachments() {
  $('#attach-list').innerHTML = attachments.map((a, i) => `<span class="att">📎 <span class="nm" title="${esc(a.name)}">${esc(a.name)}</span>` +
    (a.text == null ? `<span class="spinner"></span><span class="sz">${T('reading')}</span>` : `<span class="sz">${kchars(a.chars)}${a.truncated ? ' · ' + T('truncated') : ''}</span>`) +
    `<label title="${T('keep_title')}"><input type="checkbox" data-keep="${i}" ${a.keep ? 'checked' : ''}>${T('keep')}</label>${a.text != null ? `<button type="button" class="x" data-rev-att="${i}" title="${T('review')}">✎</button>` : ''}<button type="button" class="x" data-rm="${i}">✕</button></span>`).join('');
}
$('#attach-list').addEventListener('click', async e => {
  const b = e.target.closest('[data-rm]'); if (b) { attachments.splice(+b.dataset.rm, 1); renderAttachments(); return; }
  const rv = e.target.closest('[data-rev-att]');
  if (rv) {  // the full text, not the turn-sized excerpt
    const a = attachments[+rv.dataset.revAtt];
    const r = await fetch('/api/attachments?name=' + encodeURIComponent(a.name) + '&full=1', { method: 'POST', body: a.file });
    if (!r.ok) { toast(T('review_failed')); return; }
    startReview({ name: a.name, text: (await r.json()).text });
  }
});
$('#attach-list').addEventListener('change', e => { const c = e.target.closest('[data-keep]'); if (c) attachments[+c.dataset.keep].keep = c.checked; });
async function attach(files) {
  for (const file of files) {
    const a = { name: file.name, file, text: null, keep: false };
    attachments.push(a); renderAttachments();
    try {
      const r = await fetch('/api/attachments?name=' + encodeURIComponent(file.name), { method: 'POST', body: file });
      if (!r.ok) throw new Error((await r.json()).detail || r.statusText);
      Object.assign(a, await r.json());
    } catch (err) { toast(`${file.name}: ${err.message}`); attachments.splice(attachments.indexOf(a), 1); }
    renderAttachments();
  }
  ta.focus();
}
$('#attach').onclick = () => $('#attach-file').click();
$('#attach-file').onchange = e => { attach([...e.target.files]); e.target.value = ''; };

/* ── documents (indexed) ───────────────────────────────── */
async function loadDocs() {
  docsCache = await (await fetch('/api/documents')).json();
  $('#docs-empty').hidden = docsCache.length > 0;
  for (const s of selected) if (!docsCache.some(d => d.source === s)) selected.delete(s);
  $('#docs').innerHTML = docsCache.map(d => `<li data-open="${esc(d.source)}" class="${selected.has(d.source) ? 'on' : ''}" title="${esc(d.source)}"><input type="checkbox" data-sel="${esc(d.source)}" ${selected.has(d.source) ? 'checked' : ''} title="${T('select_title')}"><span class="t">${esc(d.title)}</span><span class="n">${d.chunks}</span><button class="an" data-rev="${esc(d.source)}" title="${T('review')}">✎</button><button class="an" data-an="${esc(d.source)}" title="${T('analyze')}">⌕</button><button class="x" data-del="${esc(d.source)}" title="✕">✕</button></li>`).join('');
  renderSelection();
}
function renderSelection() {
  const el = $('#sel'); el.hidden = !selected.size;
  el.title = T('selected_title');
  el.innerHTML = `${T('selected').replace('{n}', selected.size)} <button type="button" id="sel-clear">✕ ${T('clear')}</button>`;
  try { if (thread) localStorage.setItem('aroa.sel.' + thread, JSON.stringify([...selected])); } catch {}
}
function loadSelection() {
  selected = new Set();
  try { selected = new Set(JSON.parse(localStorage.getItem('aroa.sel.' + thread) || '[]')); } catch {}
  loadDocs();
}
$('#sel').addEventListener('click', e => { if (e.target.closest('#sel-clear')) { selected.clear(); loadDocs(); } });
$('#docs').addEventListener('change', e => {
  const c = e.target.closest('[data-sel]'); if (!c) return;
  c.checked ? selected.add(c.dataset.sel) : selected.delete(c.dataset.sel);
  loadDocs();
});
$('#docs').addEventListener('click', async e => {
  if (e.target.closest('[data-sel]')) return;
  const an = e.target.closest('[data-an]');
  const rev = e.target.closest('[data-rev]'); if (rev) { startReview({ name: rev.dataset.rev, source: rev.dataset.rev }); return; }
  if (an) { startAnalysis(an.dataset.an); return; }
  const b = e.target.closest('[data-del]');
  if (!b) { const li = e.target.closest('[data-open]'); if (li) openReader(li.dataset.open); return; }
  if (!confirm(T('remove_q').replace('{n}', b.dataset.del))) return;
  const r = await fetch('/api/documents/' + encodeURIComponent(b.dataset.del), { method: 'DELETE' });
  toast(r.ok ? T('removed') : T('not_removed')); loadDocs(); loadHealth();
});
function indexFile(file) {
  return new Promise(resolve => {
    const li = document.createElement('li'); li.className = 'job';
    li.innerHTML = `<span class="t">${esc(file.name)} · <span class="st">${T('uploading')} 0%</span></span><div class="bar"><i></i></div>`;
    $('#jobs').appendChild(li);
    const st = li.querySelector('.st'), bar = li.querySelector('.bar'), fill = li.querySelector('i');
    const xhr = new XMLHttpRequest();
    xhr.open('POST', '/api/documents?name=' + encodeURIComponent(file.name));
    xhr.upload.onprogress = ev => { if (ev.lengthComputable) { const p = Math.round(ev.loaded / ev.total * 100); fill.style.width = p + '%'; st.textContent = `${T('uploading')} ${p}%`; if (p === 100) { st.textContent = T('indexing'); bar.classList.add('busy'); } } };
    xhr.onload = () => {
      li.remove();
      if (xhr.status >= 200 && xhr.status < 300) toast(T('indexed').replace('{n}', file.name));
      else { let d = xhr.statusText; try { d = JSON.parse(xhr.responseText).detail || d; } catch {} toast(`${file.name}: ${d}`); }
      loadDocs(); loadHealth(); resolve();
    };
    xhr.onerror = () => { li.remove(); toast(`${file.name}: ${T('unreachable')}`); resolve(); };
    xhr.send(file);
  });
}
async function upload(files) { for (const f of files) await indexFile(f); }
$('#add-doc').onclick = () => $('#file').click();
$('#file').onchange = e => { upload([...e.target.files]); e.target.value = ''; };
const main = $('#main'); let dragDepth = 0;
main.addEventListener('dragenter', e => { e.preventDefault(); if (++dragDepth === 1) main.classList.add('dragging'); });
main.addEventListener('dragleave', () => { if (--dragDepth === 0) main.classList.remove('dragging'); });
main.addEventListener('dragover', e => e.preventDefault());
main.addEventListener('drop', e => {
  e.preventDefault(); dragDepth = 0; main.classList.remove('dragging');
  const files = [...e.dataTransfer.files];
  if (e.target.closest('.composer')) attach(files); else upload(files); // on the composer: attach to the message; elsewhere: index
});

/* ── status ─────────────────────────────────────────────── */
async function loadStats() {
  const r = await (await fetch('/api/report?days=1')).json();
  const claims = r.claims_checked ? `${r.claims_checked - r.claims_failed}/${r.claims_checked}` : '–';
  $('#tiles').innerHTML = [[r.turns, T('turns')], [r.latency_p50 + ' s', 'p50'], [r.llm_calls, T('model_calls')],
    [claims, T('claims_ok')], [r.facts_written, T('facts')], [`${r.feedback.up} / ${r.feedback.down}`, '👍 / 👎']]
    .map(([v, l]) => `<div class="tile"><b>${esc(v)}</b><span>${l}</span></div>`).join('');
}
async function loadHealth() {
  try {
    const h = await (await fetch('/api/health')).json();
    if (!lang) { lang = h.language === 'es' ? 'es' : 'en'; applyLang(); return; }
    $('#health').innerHTML = `<span><span class="dot"></span>${esc(h.model)}</span><span>${T('privacy')} ${esc(h.privacy_mode)}</span><span>${h.traced ? T('traced') : T('no_tracing')}</span><span>${h.memory.facts} ${T('facts')} · ${h.memory.documents} ${T('chunks')}</span>`;
  } catch { $('#health').innerHTML = `<span><span class="dot" style="background:var(--bad)"></span>${T('unreachable')}</span>`; }
}
setInterval(() => { if (thread && !busy && !column.querySelector('.welcome')) openThread(thread); }, 20000); // alarms post into the thread on their own
setInterval(loadStats, 60000);

const deepJob = /^#job=([\w-]+)$/.exec(location.hash);
if (deepJob) fetch('/api/jobs/' + deepJob[1]).then(r => r.ok ? r.json() : null).then(j => { if (j && j.status === 'done') (j.kind === 'review' ? showReview : showReport)(j); });
const deep = /^#t=([\w-]+)$/.exec(location.hash);
if (deep) openThread(deep[1]); else { thread = id(); loadThreads().then(setTitle); }
if (lang) applyLang(); else loadHealth(); // without a saved choice, the server's language decides
if (!deep) showWelcome();
loadDocs(); loadStats();
</script>
</body>
</html>
