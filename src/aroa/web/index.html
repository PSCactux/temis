<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Aroa</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231f5c4a'/%3E%3Ctext x='16' y='22' font-family='Georgia,serif' font-size='19' font-weight='700' fill='%23fff' text-anchor='middle'%3EA%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --bg:#f1f0eb; --panel:#f8f7f3; --paper:#ffffff; --line:#e3e0d8; --line-2:#cfcbc0; --hover:#ecebe5;
    --ink:#1c1b18; --ink-2:#4a4843; --muted:#7b7872;
    --accent:#1f5c4a; --accent-ink:#ffffff; --accent-soft:#e1ede7; --accent-line:#b9d4c8;
    --warn:#9a5b00; --warn-soft:#fbf1dd; --bad:#9b2c2c; --bad-soft:#f9e4e4; --ok:#2f7a47; --ok-soft:#e3f1e7; --mark:#fff1a8;
    --shadow:0 8px 28px rgba(20,20,15,.10), 0 1px 3px rgba(20,20,15,.06);
    --ui:-apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif;
    --serif:"Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, "Times New Roman", serif;
    --mono:ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --rail:72px; --side:280px; --r:10px;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg:#151717; --panel:#1b1e1e; --paper:#1f2222; --line:#2b2f2f; --line-2:#3a3f3f; --hover:#242828;
    --ink:#ebeae6; --ink-2:#bdbcb6; --muted:#8a8984;
    --accent:#86c3ab; --accent-ink:#0f1f1a; --accent-soft:#1e2f29; --accent-line:#2f4a40;
    --warn:#e0a650; --warn-soft:#2d2415; --bad:#e58585; --bad-soft:#331c1c; --ok:#86cc97; --ok-soft:#1d2e22; --mark:#5a4d12;
    --shadow:0 10px 30px rgba(0,0,0,.45), 0 1px 3px rgba(0,0,0,.4);
  } }
  :root[data-theme="dark"] {
    --bg:#151717; --panel:#1b1e1e; --paper:#1f2222; --line:#2b2f2f; --line-2:#3a3f3f; --hover:#242828;
    --ink:#ebeae6; --ink-2:#bdbcb6; --muted:#8a8984;
    --accent:#86c3ab; --accent-ink:#0f1f1a; --accent-soft:#1e2f29; --accent-line:#2f4a40;
    --warn:#e0a650; --warn-soft:#2d2415; --bad:#e58585; --bad-soft:#331c1c; --ok:#86cc97; --ok-soft:#1d2e22; --mark:#5a4d12;
    --shadow:0 10px 30px rgba(0,0,0,.45), 0 1px 3px rgba(0,0,0,.4);
  }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; height:100vh; font:13.5px/1.5 var(--ui); color:var(--ink); background:var(--bg); display:grid; grid-template-columns:var(--rail) var(--side) 1fr; grid-template-rows:minmax(0, 1fr); overflow:hidden; -webkit-font-smoothing:antialiased; }
  button, input, textarea { font:inherit; color:inherit; }
  button { cursor:pointer; }
  a { color:var(--accent); }
  ::selection { background:var(--accent-soft); }
  svg.i { width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; flex:none; }
  [hidden] { display:none !important; }
  * { scrollbar-width:thin; scrollbar-color:var(--line-2) transparent; }
  *::-webkit-scrollbar { width:8px; height:8px; } *::-webkit-scrollbar-track { background:transparent; }
  *::-webkit-scrollbar-thumb { background:var(--line-2); border-radius:8px; border:2px solid transparent; background-clip:padding-box; }
  *::-webkit-scrollbar-thumb:hover { background:var(--muted); border:2px solid transparent; background-clip:padding-box; }
  .settings, .settings p, .settings label, .settings .btn, .settings li { font-family:var(--ui); } .settings { font-size:13.5px; }
  .settings .guide p, .settings .guide li { font-size:13.5px; line-height:1.6; }
  .rail { overflow-y:auto; scrollbar-width:none; } .rail::-webkit-scrollbar { display:none; }
  .settings h1 { font-family:var(--serif); }
  .settings .cards { display:grid; grid-template-columns:repeat(3, 1fr); gap:10px; margin:10px 0 18px; }
  .settings .card { border:1px solid var(--line); border-radius:10px; padding:10px 12px; cursor:pointer; background:var(--paper); }
  .settings .card:hover { border-color:var(--accent-line); } .settings .card.on { border-color:var(--accent); box-shadow:0 0 0 2px var(--accent-soft); }
  .settings .card b { display:block; font-size:13.5px; } .settings .card span { color:var(--muted); font-size:12px; line-height:1.4; display:block; margin-top:2px; }
  .settings .card .tag { margin-top:6px; display:inline-block; }
  .settings .frm { display:grid; grid-template-columns:200px 1fr; gap:10px 16px; align-items:center; margin:8px 0 14px; }
  .settings .frm label { color:var(--ink-2); font-size:13px; } .settings .frm small { display:block; color:var(--muted); font-size:11.5px; }
  .settings .frm input, .settings .frm select { border:1px solid var(--line-2); border-radius:8px; padding:7px 10px; background:var(--panel); color:var(--ink); font:inherit; font-family:var(--mono); font-size:12.5px; width:100%; }
  .settings .frm input:focus, .settings .frm select:focus { outline:none; border-color:var(--accent-line); box-shadow:0 0 0 3px var(--accent-soft); }
  .settings .acts { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:6px 0 20px; }
  .settings .probe { font-size:12.5px; color:var(--ink-2); } .settings .probe.ok { color:var(--ok); } .settings .probe.bad { color:var(--bad); }
  .settings pre { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px 12px; overflow:auto; font-size:12px; line-height:1.5; }
  .settings .guide h3 { font-size:13px; margin:18px 0 6px; } .settings .guide p { color:var(--ink-2); margin:0 0 8px; } .settings .guide li { color:var(--ink-2); }
  .settings .note { background:var(--warn-soft); color:var(--warn); border-radius:8px; padding:8px 12px; font-size:12.5px; margin:8px 0; }

  /* ── buttons ── */
  .btn { display:inline-flex; align-items:center; gap:7px; height:32px; padding:0 12px; border-radius:8px; border:1px solid var(--line-2); background:var(--paper); color:var(--ink); font-weight:500; white-space:nowrap; }
  .btn:hover { background:var(--hover); }
  .btn.primary { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
  .btn.primary:hover { filter:brightness(1.06); }
  .btn.ghost { border-color:transparent; background:transparent; color:var(--ink-2); }
  .btn.ghost:hover { background:var(--hover); color:var(--ink); }
  .btn.sm { height:26px; padding:0 9px; font-size:12.5px; border-radius:7px; }
  .btn.icon { width:32px; padding:0; justify-content:center; }
  .btn.sm.icon { width:26px; }
  .btn:disabled { opacity:.5; cursor:default; }
  .btn.danger:hover { color:var(--bad); background:var(--bad-soft); }

  /* ── rail ── */
  .rail { background:var(--panel); border-right:1px solid var(--line); display:flex; flex-direction:column; align-items:center; padding:12px 0 10px; gap:4px; min-height:0; overflow:hidden; }
  .rail .brand { width:36px; height:36px; border-radius:9px; background:var(--accent); color:var(--accent-ink); display:grid; place-items:center; font:700 19px/1 var(--serif); margin-bottom:12px; }
  .rail button { width:60px; height:54px; border:0; background:transparent; border-radius:10px; color:var(--muted); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; font-size:10px; font-weight:500; letter-spacing:.01em; position:relative; }
  .rail button svg.i { width:20px; height:20px; }
  .rail button:hover { background:var(--hover); color:var(--ink); }
  .rail button.active { background:var(--accent-soft); color:var(--accent); }
  .rail .grow { flex:1; }
  .rail .badge { position:absolute; top:6px; right:10px; min-width:16px; height:16px; border-radius:8px; background:var(--accent); color:var(--accent-ink); font-size:10px; line-height:16px; text-align:center; padding:0 4px; }
  .rail .dot { position:absolute; top:9px; right:16px; width:7px; height:7px; border-radius:50%; background:var(--ok); }
  .rail .dot.bad { background:var(--bad); }

  /* ── side panel ── */
  .side { background:var(--panel); border-right:1px solid var(--line); display:flex; flex-direction:column; min-width:0; min-height:0; }
  .sp-view { display:flex; flex-direction:column; flex:1; min-height:0; }
  .side .sh { display:flex; align-items:center; gap:8px; padding:16px 14px 8px; }
  .side .sh h2 { margin:0; font-size:15px; font-weight:600; flex:1; letter-spacing:-.01em; }
  .side .filter { margin:4px 12px 8px; position:relative; }
  .side .filter input { width:100%; height:32px; border:1px solid var(--line); border-radius:8px; background:var(--paper); padding:0 10px 0 32px; outline:none; }
  .side .filter input:focus { border-color:var(--accent-line); box-shadow:0 0 0 3px var(--accent-soft); }
  .side .filter svg.i { position:absolute; left:10px; top:7px; width:16px; height:16px; color:var(--muted); }
  .side .list { flex:1; min-height:0; overflow:auto; padding:0 8px 12px; }
  .side .empty { padding:24px 16px; color:var(--muted); font-size:12.5px; text-align:center; line-height:1.5; }
  .side .sec { padding:12px 8px 4px; font-size:11px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); }
  .item { display:flex; gap:10px; align-items:flex-start; padding:9px 10px; border-radius:8px; cursor:pointer; position:relative; }
  .item:hover { background:var(--hover); }
  .item.active { background:var(--paper); box-shadow:inset 0 0 0 1px var(--line); }
  .item .ic { width:28px; height:28px; border-radius:7px; background:var(--accent-soft); color:var(--accent); display:grid; place-items:center; flex:none; margin-top:1px; }
  .item .ic svg.i { width:15px; height:15px; }
  .item .ic.warn { background:var(--warn-soft); color:var(--warn); }
  .item .ic.bad { background:var(--bad-soft); color:var(--bad); }
  .item .ic.ok { background:var(--ok-soft); color:var(--ok); }
  .item .tx { flex:1; min-width:0; }
  .item .t { font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .item .m { display:flex; gap:6px; align-items:center; color:var(--muted); font-size:11.5px; margin-top:2px; white-space:nowrap; overflow:hidden; }
  .item .m .chip { font-family:var(--mono); font-size:10.5px; background:var(--accent-soft); color:var(--accent); padding:0 6px; border-radius:5px; }
  .item input[type=checkbox] { margin:7px 0 0; accent-color:var(--accent); flex:none; }
  .item .bar { height:3px; border-radius:2px; background:var(--line); margin-top:6px; overflow:hidden; }
  .item .bar i { display:block; height:100%; width:0; background:var(--accent); transition:width .3s; }
  .item .bar.busy i { width:35%; animation:slide 1.2s infinite ease-in-out; }
  @keyframes slide { 0% { margin-left:-35%; } 100% { margin-left:100%; } }
  .side .note { margin:0 12px 8px; padding:8px 10px; border-radius:8px; background:var(--accent-soft); color:var(--accent); font-size:12px; display:flex; align-items:center; gap:8px; }
  .side .note button { margin-left:auto; border:0; background:transparent; color:inherit; font-weight:600; font-size:12px; }

  /* ── work area ── */
  .work { display:flex; flex-direction:column; min-width:0; min-height:0; position:relative; }
  .info { font-family:var(--ui); font-size:14px; line-height:1.6; }
  .info h1 { font-family:var(--serif); }
  .info h2 { margin-top:28px; }
  .info p, .info li { color:var(--ink-2); }
  .info .kv { display:grid; grid-template-columns:auto 1fr; gap:4px 16px; font-size:13px; margin:10px 0 16px; }
  .info .kv span:nth-child(odd) { color:var(--muted); } .info .kv b { font-family:var(--mono); font-weight:500; font-size:12.5px; }
  .info .flow { display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin:8px 0 14px; } .info .flow span { background:var(--accent-soft); color:var(--accent); border-radius:6px; padding:3px 9px; font-size:12.5px; font-weight:500; } .info .flow i { color:var(--muted); font-style:normal; }
  .info .mem { border:1px solid var(--line); border-radius:8px; padding:8px 10px; margin:6px 0; display:grid; grid-template-columns:1fr auto; gap:8px; align-items:start; font-size:13px; }
  .info .mem small { display:block; color:var(--muted); font-family:var(--mono); font-size:11px; margin-top:2px; }
  .topbar { height:52px; display:flex; align-items:center; gap:10px; padding:0 18px; border-bottom:1px solid var(--line); background:var(--panel); flex:none; }
  .topbar .title { font-weight:600; font-size:14.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; letter-spacing:-.01em; }
  .topbar .sub { color:var(--muted); font-size:12px; white-space:nowrap; overflow:hidden; text-outline:none; text-overflow:ellipsis; }
  .topbar .sp { flex:1; }
  .topbar .matter { display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--muted); }
  .topbar .matter input { width:130px; height:30px; border:1px solid var(--line-2); border-radius:7px; background:var(--paper); padding:0 9px; font-family:var(--mono); font-size:12px; outline:none; }
  .topbar .matter input:focus { border-color:var(--accent-line); box-shadow:0 0 0 3px var(--accent-soft); }
  .pill { display:inline-flex; align-items:center; gap:6px; height:26px; padding:0 10px; border-radius:13px; font-size:12px; background:var(--accent-soft); color:var(--accent); font-weight:500; }
  .pill button { border:0; background:transparent; color:inherit; padding:0; display:flex; }
  .pill.err { background:var(--bad-soft); color:var(--bad); } .pill.warn { background:var(--warn-soft); color:var(--warn); } .pill.ok { background:var(--ok-soft); color:var(--ok); } .pill.plain { background:var(--hover); color:var(--ink-2); }
  #menu { display:none; }
  .stage { flex:1; display:flex; min-height:0; }
  .view { flex:1; min-width:0; min-height:0; display:flex; flex-direction:column; }
  .center { flex:1; display:grid; place-items:center; padding:40px; }
  .empty-state { max-width:420px; text-align:center; color:var(--muted); }
  .empty-state .ic { width:48px; height:48px; border-radius:12px; background:var(--accent-soft); color:var(--accent); display:grid; place-items:center; margin:0 auto 14px; }
  .empty-state .ic svg.i { width:22px; height:22px; }
  .empty-state h3 { margin:0 0 6px; color:var(--ink); font-size:16px; font-weight:600; }
  .empty-state p { margin:0 0 16px; font-size:13px; line-height:1.55; }

  /* ── chat ── */
  #log { flex:1; overflow:auto; padding:28px 24px 8px; }
  .column { max-width:780px; margin:0 auto; }
  .msg { margin:0 0 22px; }
  .msg.user { display:flex; justify-content:flex-end; }
  .msg.user .bubble { max-width:78%; background:var(--paper); border:1px solid var(--line); border-radius:14px 14px 4px 14px; padding:10px 14px; white-space:pre-wrap; overflow-wrap:anywhere; box-shadow:0 1px 2px rgba(0,0,0,.04); }
  .msg.notice { display:flex; justify-content:center; }
  .msg.notice .bubble { background:var(--warn-soft); color:var(--warn); border-radius:10px; padding:8px 14px; font-size:13px; display:flex; gap:8px; align-items:center; }
  .msg .files { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .msg .file { display:inline-flex; align-items:center; gap:5px; font-size:12px; background:var(--hover); border-radius:6px; padding:3px 8px; }
  .msg.ai { display:grid; grid-template-columns:30px 1fr; gap:12px; }
  .msg.ai .av { width:30px; height:30px; border-radius:8px; background:var(--accent); color:var(--accent-ink); display:grid; place-items:center; font:700 15px/1 var(--serif); margin-top:2px; }
  .msg.ai .head { display:flex; align-items:center; gap:8px; margin-bottom:4px; font-size:12.5px; color:var(--muted); flex-wrap:wrap; }
  .msg.ai .head b { color:var(--ink); font-weight:600; }
  .tag { font-size:10.5px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; padding:2px 7px; border-radius:5px; background:var(--hover); color:var(--ink-2); }
  .tag.ok { background:var(--ok-soft); color:var(--ok); } .tag.fail { background:var(--warn-soft); color:var(--warn); } .tag.blocked { background:var(--bad-soft); color:var(--bad); } .tag.question { background:var(--accent-soft); color:var(--accent); }
  .body { font-size:14.5px; line-height:1.6; overflow-wrap:anywhere; }
  .body p { margin:0 0 10px; } .body p:last-child { margin-bottom:0; }
  .body h3 { font-size:12px; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); margin:16px 0 6px; font-weight:600; }
  .body ul, .body ol { margin:4px 0 10px; padding-left:22px; } .body li { margin:3px 0; }
  .body blockquote { margin:4px 0 10px; padding:6px 12px; border-left:3px solid var(--accent-line); background:var(--panel); border-radius:0 8px 8px 0; color:var(--ink-2); font-family:var(--serif); font-size:14px; }
  .body code { font-family:var(--mono); font-size:12.5px; background:var(--hover); padding:1px 5px; border-radius:4px; }
  .body pre { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px 12px; overflow:auto; }
  .body pre code { background:none; padding:0; }
  .cite { font-family:var(--mono); font-size:11.5px; font-weight:600; color:var(--accent); background:transparent; border:0; padding:0 3px; border-radius:4px; cursor:default; }
  .cite.link { cursor:pointer; background:var(--accent-soft); }
  .cite.link:hover { text-decoration:underline; }
  .cite.unverified { color:var(--warn); background:var(--warn-soft); }
  .question-card { border:1px solid var(--accent-line); background:var(--accent-soft); border-radius:10px; padding:10px 14px; }
  .question-card .lbl { font-size:11px; font-weight:600; letter-spacing:.07em; text-transform:uppercase; color:var(--accent); margin-bottom:4px; }
  .actions { display:flex; align-items:center; gap:2px; margin-top:8px; opacity:.55; transition:opacity .15s; }
  .msg.ai:hover .actions { opacity:1; }
  .actions .btn.on { color:var(--accent); background:var(--accent-soft); }
  .live { display:flex; align-items:center; gap:10px; color:var(--muted); font-size:12.5px; margin:4px 0 8px; }
  .steps { margin:2px 0 10px; border-left:2px solid var(--line-2); padding-left:12px; font-size:12.5px; }
  .steps .stp { display:grid; grid-template-columns:16px 1fr; gap:8px; padding:3px 0; color:var(--ink-2); align-items:start; }
  .steps .stp .dot { width:8px; height:8px; border-radius:50%; background:var(--ok); margin:6px 0 0 3px; }
  .steps .stp.pending .dot { background:transparent; border:2px solid var(--line-2); border-top-color:var(--accent); width:10px; height:10px; margin:4px 0 0 1px; animation:spin .8s linear infinite; }
  .steps .stp.bad .dot { background:var(--warn); }
  .steps .stp .tt { font-weight:600; color:var(--ink); } .steps .stp .tt small { font-weight:400; color:var(--muted); margin-left:6px; font-family:var(--mono); font-size:11px; }
  .steps .stp .sm { color:var(--ink-2); }
  .steps .stp .its { margin:2px 0 0; padding-left:14px; color:var(--muted); font-size:11.5px; }
  .steps .stp .its li { margin:1px 0; }
  .steps.done .stp.pending { display:none; }
  .joblog { font-family:var(--ui); font-size:13px; white-space:normal; }
  .joblog .ln { display:grid; grid-template-columns:64px 1fr; gap:10px; padding:5px 0; border-bottom:1px solid var(--line); } .joblog .ln:last-child { border:0; }
  .joblog .ln time { font-family:var(--mono); font-size:11.5px; color:var(--muted); padding-top:2px; }
  .joblog .ln.last { color:var(--ink); font-weight:500; }
  .crumbs { display:flex; gap:6px; flex-wrap:wrap; }
  .crumbs span { background:var(--hover); border-radius:5px; padding:2px 8px; }
  .spinner { width:14px; height:14px; border:2px solid var(--line-2); border-top-color:var(--accent); border-radius:50%; animation:spin .8s linear infinite; flex:none; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .path { display:none; margin-top:8px; border:1px solid var(--line); border-radius:10px; background:var(--panel); padding:10px 14px; font-size:12.5px; }
  .path.open { display:block; }
  .path .sum { display:flex; flex-wrap:wrap; gap:6px 16px; color:var(--muted); padding-bottom:8px; border-bottom:1px solid var(--line); margin-bottom:6px; }
  .path .sum b { color:var(--ink); }
  .path .step { padding:6px 0 6px 14px; border-left:2px solid var(--line-2); margin-left:4px; }
  .path .step.bad { border-left-color:var(--warn); }
  .path .step.audit { border-left-color:var(--accent-line); }
  .path .st { font-weight:600; display:flex; gap:8px; align-items:baseline; } .path .st small { color:var(--muted); font-weight:400; font-family:var(--mono); }
  .path .sm { color:var(--ink-2); }
  .path .items { margin:4px 0 0; padding-left:16px; color:var(--ink-2); font-family:var(--mono); font-size:11.5px; }
  .welcome { padding:40px 0 20px; }
  .welcome h2 { font:600 26px/1.2 var(--serif); letter-spacing:-.01em; margin:0 0 8px; text-align:center; }
  .welcome p { margin:0 auto 22px; color:var(--muted); text-align:center; max-width:520px; }
  .suggest { display:grid; grid-template-columns:repeat(3, 1fr); gap:10px; }
  .suggest button { text-align:left; background:var(--paper); border:1px solid var(--line); border-radius:12px; padding:12px 14px; line-height:1.45; color:var(--ink-2); transition:border-color .15s, transform .15s; }
  .suggest button:hover { border-color:var(--accent-line); color:var(--ink); transform:translateY(-1px); }
  .suggest b { display:block; font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--accent); margin-bottom:5px; }
  .composer { padding:8px 24px 16px; flex:none; }
  .composer form { max-width:780px; margin:0 auto; background:var(--paper); border:1px solid var(--line-2); border-radius:14px; box-shadow:0 1px 2px rgba(0,0,0,.04); transition:border-color .15s, box-shadow .15s; }
  .composer form:focus-within { border-color:var(--accent-line); box-shadow:0 0 0 3px var(--accent-soft); }
  .composer .atts { display:flex; flex-wrap:wrap; gap:6px; padding:10px 12px 0; }
  .composer .atts:empty { display:none; }
  .att { display:inline-flex; align-items:center; gap:8px; max-width:100%; font-size:12.5px; padding:5px 6px 5px 10px; border-radius:8px; background:var(--panel); border:1px solid var(--line); }
  .att .nm { max-width:200px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-weight:500; }
  .att .sz { color:var(--muted); font-size:11.5px; }
  .att label { display:inline-flex; align-items:center; gap:4px; color:var(--ink-2); cursor:pointer; font-size:12px; }
  .att input[type=checkbox] { accent-color:var(--accent); margin:0; }
  .composer .line { display:flex; align-items:flex-end; gap:6px; padding:8px 8px 8px 10px; }
  .composer textarea { flex:1; border:0; outline:0; background:transparent; resize:none; max-height:200px; padding:7px 4px; font-size:14.5px; line-height:1.45; }
  .composer .send { width:34px; height:34px; border-radius:9px; border:0; background:var(--accent); color:var(--accent-ink); display:grid; place-items:center; }
  .composer .send:disabled { opacity:.45; }
  .hint { max-width:780px; margin:8px auto 0; font-size:11.5px; color:var(--muted); text-align:center; }

  /* ── paper (documents, drafts, reports) ── */
  .scrollv { flex:1; overflow:auto; min-height:0; }
  .paper { max-width:820px; margin:24px auto 48px; background:var(--paper); border:1px solid var(--line); border-radius:12px; padding:40px 48px; font-family:var(--serif); font-size:15px; line-height:1.7; white-space:pre-wrap; overflow-wrap:anywhere; box-shadow:0 1px 2px rgba(0,0,0,.04); }
  .paper.prose { white-space:normal; }
  .paper.prose h1 { font-size:22px; margin:0 0 14px; font-weight:600; letter-spacing:-.01em; }
  .paper.prose h2 { font-family:var(--ui); font-size:11.5px; letter-spacing:.09em; text-transform:uppercase; color:var(--accent); margin:26px 0 8px; font-weight:600; }
  .paper.prose h3 { font-family:var(--ui); font-size:12px; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); margin:18px 0 6px; }
  .paper.prose p { margin:0 0 10px; }
  .paper.prose ul { padding-left:20px; } .paper.prose li { margin:6px 0; }
  .paper.prose blockquote { margin:4px 0 10px; padding:4px 12px; border-left:3px solid var(--accent-line); color:var(--ink-2); font-size:14px; }
  .paper.prose .cite { font-size:11.5px; }
  .mh { display:block; font-weight:600; letter-spacing:-.01em; } .mh1 { font-size:22px; line-height:1.3; } .mh2 { font-size:17px; } .mh3 { font-size:15.5px; }
  .mq { display:block; padding-left:12px; border-left:3px solid var(--accent-line); color:var(--ink-2); font-style:italic; }
  .paper mark { background:var(--mark); color:inherit; border-radius:3px; padding:1px 2px; }
  .paper mark.iss { background:var(--warn-soft); border-bottom:2px solid var(--warn); cursor:pointer; }
  .paper mark.iss.err { background:var(--bad-soft); border-bottom-color:var(--bad); }
  .paper mark.iss.focus { outline:2px solid var(--accent); outline-offset:2px; }
  .procpaper { font-family:var(--ui); font-size:13.5px; }
  .procpaper h1 { font-family:var(--serif); }
  .procpaper .lead { color:var(--ink-2); font-size:14px; margin:0 0 18px; }
  .procpaper .fields { display:grid; grid-template-columns:1fr 1fr; gap:12px 18px; margin:8px 0 18px; }
  .procpaper .fld { display:flex; flex-direction:column; gap:4px; }
  .procpaper .fld.wide { grid-column:1 / -1; }
  .procpaper .fld label { font-size:12.5px; font-weight:600; color:var(--ink); }
  .procpaper .fld small { color:var(--muted); font-weight:400; }
  .procpaper .fld input, .procpaper .fld textarea { border:1px solid var(--line-2); border-radius:8px; padding:7px 10px; background:var(--panel); font:inherit; color:var(--ink); resize:vertical; }
  .procpaper .fld input:focus, .procpaper .fld textarea:focus { outline:none; border-color:var(--accent-line); box-shadow:0 0 0 3px var(--accent-soft); background:var(--paper); }
  .procpaper .ck { list-style:none; padding:0; } .procpaper .ck li { display:flex; gap:8px; align-items:flex-start; padding:4px 0; } .procpaper .ck li svg.i { width:15px; height:15px; color:var(--accent); margin-top:3px; }
  .procpaper .instr { white-space:pre-wrap; color:var(--ink-2); font-family:var(--serif); font-size:14px; }
  .rv .issues .check { border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin:0 0 10px; background:var(--paper); font-size:13px; }
  .rv .issues .check h5 { margin:0 0 6px; font-size:11.5px; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); }
  .rv .issues .check .it { display:grid; grid-template-columns:18px 1fr; gap:8px; padding:4px 0; }
  .rv .issues .check .it svg.i { width:15px; height:15px; } .rv .issues .check .it.ok svg.i { color:var(--ok); } .rv .issues .check .it.no svg.i { color:var(--bad); }
  .rv .issues .check .it q { display:block; color:var(--muted); font-size:12px; font-family:var(--serif); }
  .editor-wrap { flex:1; min-height:0; position:relative; display:flex; flex-direction:column; background:var(--bg); }
  body > .tox-tinymce-aux { position:absolute !important; top:0; left:0; width:0; height:0; }  /* TinyMCE's popup sink must not become a grid cell */
  .editor-wrap .tox-tinymce { flex:1; border:0 !important; border-radius:0 !important; height:auto !important; }
  .editor-wrap .tox .tox-edit-area::before { display:none; }
  .editor-wrap .tox:not(.tox-tinymce-inline) .tox-editor-header { box-shadow:none !important; border-bottom:1px solid var(--line) !important; padding:4px 12px !important; background:var(--panel) !important; }
  .editor-wrap .tox .tox-toolbar__primary { background:transparent !important; }
  .editor-wrap .tox .tox-statusbar { border-top:1px solid var(--line) !important; background:var(--panel) !important; }
  .editor-wrap .tox .tox-edit-area__iframe { background:var(--bg) !important; }
  .pop.versions { position:absolute; left:auto; right:24px; top:8px; bottom:auto; width:340px; max-height:60%; overflow:auto; }
  .pop.versions .row { align-items:center; } .pop.versions .row .acts { display:flex; gap:4px; }
  .toolbar .name { font-weight:600; color:var(--ink); font-size:13.5px; border:1px solid transparent; border-radius:6px; padding:2px 6px; width:280px; max-width:40%; background:transparent; }
  .toolbar .name:focus { outline:none; border-color:var(--accent-line); background:var(--paper); }
  .toolbar .state { color:var(--muted); white-space:nowrap; } .toolbar .state.dirty { color:var(--warn); }
  .toolbar { display:flex; align-items:center; gap:8px; padding:10px 24px; border-bottom:1px solid var(--line); background:var(--panel); flex:none; font-size:12.5px; color:var(--muted); min-height:52px; }
  .toolbar .stats { min-width:0; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .toolbar .sp { flex:1; }
  .clip { position:fixed; z-index:40; display:none; box-shadow:var(--shadow); }
  .clip.show { display:inline-flex; }

  /* ── review ── */
  .rv { flex:1; display:flex; min-height:0; }
  .rv .scrollv { flex:1; }
  .rv .issues { width:400px; flex:none; border-left:1px solid var(--line); background:var(--panel); overflow:auto; padding:14px; }
  .issue { border:1px solid var(--line); border-left:3px solid var(--warn); border-radius:10px; padding:10px 12px; margin:0 0 10px; font-size:13px; cursor:pointer; background:var(--paper); }
  .issue.err { border-left-color:var(--bad); }
  .issue.focus { box-shadow:0 0 0 2px var(--accent-line); }
  .issue.accept { background:var(--accent-soft); } .issue.reject { opacity:.5; }
  .issue .ih { display:flex; gap:8px; align-items:baseline; font-size:11.5px; color:var(--muted); flex-wrap:wrap; }
  .issue .num { font-family:var(--mono); color:var(--accent); font-weight:600; } .issue .kind { font-weight:600; color:var(--ink); }
  .issue .why { margin:5px 0; color:var(--ink-2); }
  .issue blockquote { margin:5px 0; padding:3px 10px; border-left:2px solid var(--line-2); color:var(--ink-2); font-size:12.5px; font-family:var(--serif); }
  .issue .orig, .issue .chg { font-size:12.5px; color:var(--ink-2); margin:5px 0; } .issue .chg { color:var(--accent); font-family:var(--serif); }
  .issue .orig button { font-family:var(--ui); font-size:11.5px; }
  .issue .src { font-family:var(--mono); font-size:11px; word-break:break-all; display:block; margin-top:3px; }
  .issue .acts { display:flex; gap:6px; margin-top:8px; }
  .issue .acts button { height:26px; padding:0 10px; font-size:12px; border-radius:7px; border:1px solid var(--line-2); background:var(--paper); color:var(--ink); display:inline-flex; align-items:center; gap:5px; }
  .issue .acts button svg.i { width:13px; height:13px; }
  .issue.accept .acts [data-dec=accept], .issue.reject .acts [data-dec=reject] { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
  .rv-note { font-size:12.5px; color:var(--muted); font-style:italic; margin:0 0 10px; }
  .rv-note.ok { color:var(--ok); font-style:normal; }

  /* ── inspector ── */
  .inspector { width:0; flex:none; border-left:1px solid var(--line); background:var(--panel); display:flex; flex-direction:column; overflow:hidden; transition:width .2s; }
  .inspector.open { width:min(480px, 44%); }
  .inspector .ih { display:flex; align-items:center; gap:8px; padding:10px 12px 10px 16px; border-bottom:1px solid var(--line); min-height:52px; }
  .inspector .ih .t { flex:1; font-weight:600; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .inspector .ih small { display:block; color:var(--muted); font-weight:400; font-size:11.5px; font-family:var(--mono); }
  .inspector .ib { flex:1; overflow:auto; padding:18px 20px; font-family:var(--serif); font-size:14px; line-height:1.65; white-space:pre-wrap; overflow-wrap:anywhere; }
  .inspector .ib mark { background:var(--mark); color:inherit; border-radius:3px; padding:1px 2px; }

  /* ── popovers ── */
  .pop { position:fixed; left:80px; bottom:14px; width:320px; background:var(--paper); border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow); padding:14px 16px; z-index:50; display:none; }
  .pop.open { display:block; }
  .pop h4 { margin:0 0 10px; font-size:13px; font-weight:600; display:flex; align-items:center; gap:8px; }
  .pop h4 .sp { flex:1; }
  .pop .row { display:flex; justify-content:space-between; gap:10px; padding:6px 0; border-top:1px solid var(--line); font-size:12.5px; }
  .pop .row span:first-child { color:var(--muted); }
  .pop .row b { font-weight:500; font-family:var(--mono); font-size:12px; }
  .pop .tiles { display:grid; grid-template-columns:repeat(3, 1fr); gap:6px; margin:4px 0 10px; }
  .pop .tile { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:7px 9px; }
  .pop .tile b { display:block; font-size:15px; font-weight:600; } .pop .tile span { font-size:11px; color:var(--muted); }
  .pop .links { display:flex; gap:12px; font-size:12px; margin-top:8px; }
  .pop .alarm { padding:7px 0; border-top:1px solid var(--line); font-size:12.5px; } .pop .alarm small { display:block; color:var(--muted); font-family:var(--mono); font-size:11px; }
  .pop .empty { color:var(--muted); font-size:12.5px; padding:4px 0; }

  .drop { position:absolute; inset:0; display:none; place-items:center; background:color-mix(in srgb, var(--bg) 82%, transparent); border:2px dashed var(--accent); z-index:10; font-weight:600; color:var(--accent); font-size:16px; backdrop-filter:blur(2px); }
  .work.dragging .drop { display:grid; }
  .toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:9px 16px; border-radius:999px; font-size:13px; box-shadow:var(--shadow); opacity:0; transition:opacity .2s; pointer-events:none; z-index:60; }
  .toast.show { opacity:1; }

  .rail { grid-column:1; } .side { grid-column:2; } .work { grid-column:3; }
  body.noside { grid-template-columns:var(--rail) 0 1fr; } body.noside .side { display:none; }
  @media (max-width: 1100px) { .rv .issues { width:340px; } .suggest { grid-template-columns:repeat(2, 1fr); } }
  @media (max-width: 860px) {
    body { grid-template-columns:var(--rail) 1fr; }
    .side { position:fixed; left:var(--rail); top:0; bottom:0; width:min(320px, 85vw); z-index:30; transform:translateX(-110%); transition:transform .2s; box-shadow:var(--shadow); }
    .side.open { transform:none; }
    #menu { display:inline-flex; }
    .topbar { padding:0 12px; } .topbar .matter input { width:100px; }
    #log { padding:20px 14px 8px; } .composer { padding:8px 12px 12px; } .suggest { grid-template-columns:1fr; }
    .paper { padding:24px 20px; margin:12px; border-radius:10px; }
    .rv { flex-direction:column; } .rv .issues { width:auto; border-left:0; border-top:1px solid var(--line); max-height:45%; }
    .inspector.open { position:absolute; inset:0; width:100%; z-index:5; }
    .pop { left:12px; right:12px; width:auto; }
  }

  /* ══ modern skin: neutral greys, black accents, pills, icon rail ══════════════════ */
  :root {
    --bg:#f3f3f4; --panel:#ffffff; --paper:#ffffff; --line:#e9e9eb; --line-2:#dcdcdf; --hover:#f4f4f5;
    --ink:#111113; --ink-2:#3f3f46; --muted:#8b8b92;
    --accent:#111113; --accent-ink:#ffffff; --accent-soft:#f1f1f3; --accent-line:#c9c9ce;
    --hot:#f15a24; --hot-soft:#fff1eb;
    --warn:#c2410c; --warn-soft:#fff4ec; --bad:#dc2626; --bad-soft:#fef1f1; --ok:#16a34a; --ok-soft:#effaf2; --mark:#fff3b0;
    --shadow:0 12px 32px rgba(17,17,19,.08), 0 2px 6px rgba(17,17,19,.05);
    --ui:"Inter", "Geist", -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --rail:64px; --side:276px;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg:#0e0e10; --panel:#151517; --paper:#18181b; --line:#26262a; --line-2:#34343a; --hover:#1f1f23;
    --ink:#f4f4f5; --ink-2:#c7c7cc; --muted:#8b8b92;
    --accent:#f4f4f5; --accent-ink:#111113; --accent-soft:#232327; --accent-line:#45454c;
    --hot:#ff7a45; --hot-soft:#2a1810; --warn:#fb923c; --warn-soft:#2a1a0f; --bad:#f87171; --bad-soft:#2a1414; --ok:#4ade80; --ok-soft:#10241a; --mark:#4a3f0f;
  } }
  :root[data-theme="dark"] {
    --bg:#0e0e10; --panel:#151517; --paper:#18181b; --line:#26262a; --line-2:#34343a; --hover:#1f1f23;
    --ink:#f4f4f5; --ink-2:#c7c7cc; --muted:#8b8b92;
    --accent:#f4f4f5; --accent-ink:#111113; --accent-soft:#232327; --accent-line:#45454c;
    --hot:#ff7a45; --hot-soft:#2a1810; --warn:#fb923c; --warn-soft:#2a1a0f; --bad:#f87171; --bad-soft:#2a1414; --ok:#4ade80; --ok-soft:#10241a; --mark:#4a3f0f;
  }
  body { font-size:13.5px; letter-spacing:-.003em; }

  /* buttons: pills */
  .btn { border-radius:999px; height:32px; padding:0 14px; font-weight:500; border-color:var(--line-2); box-shadow:0 1px 1px rgba(0,0,0,.03); }
  .btn.sm { height:28px; padding:0 11px; border-radius:999px; font-size:12.5px; }
  .btn.icon, .btn.sm.icon { padding:0; border-radius:50%; }
  .btn.primary { background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
  .btn.primary:hover { filter:none; opacity:.88; }
  .btn.ghost { box-shadow:none; }

  /* rail: icons only */
  .rail { background:var(--panel); padding:14px 0 12px; gap:6px; }
  .rail .brand { width:36px; height:36px; border-radius:50%; background:var(--accent); color:var(--accent-ink); font:600 16px/1 var(--ui); margin-bottom:14px; }
  .rail button { width:40px; height:40px; border-radius:11px; color:var(--muted); gap:0; }
  .rail button [data-i18n] { display:none; }
  .rail button svg.i { width:19px; height:19px; stroke-width:1.7; }
  .rail button:hover { background:var(--hover); color:var(--ink); }
  .rail button.active { background:var(--hover); color:var(--ink); box-shadow:inset 0 0 0 1px var(--line); }
  .rail #lang span:first-child { font-size:11.5px !important; }
  .rail .badge { top:3px; right:2px; background:var(--hot); color:#fff; min-width:15px; height:15px; line-height:15px; font-size:9.5px; }
  .rail .dot { top:8px; right:9px; width:6px; height:6px; }
  .rail .sep { width:24px; height:1px; background:var(--line); margin:6px 0; }

  /* side panel */
  .side { background:var(--panel); }
  .side .sh { padding:18px 14px 10px 16px; }
  .side .sh h2 { font-size:15px; font-weight:600; letter-spacing:-.015em; }
  .side .filter input { border-radius:999px; height:34px; background:var(--bg); border-color:transparent; }
  .side .filter input:focus { background:var(--paper); border-color:var(--line-2); box-shadow:0 0 0 3px var(--accent-soft); }
  .item { border-radius:10px; padding:8px 10px; }
  .item.active { background:var(--hover); box-shadow:none; }
  .item .t { font-weight:500; font-size:13px; }
  .item .m { font-size:11.5px; }
  .item .m .chip { font-family:var(--ui); background:transparent; border:1px solid var(--line-2); color:var(--ink-2); border-radius:999px; padding:0 7px; font-size:10.5px; }
  .item .ic { border-radius:50%; background:var(--hover); color:var(--ink-2); }
  .item .ic.warn { background:var(--hot-soft); color:var(--hot); }
  .item .ic.ok { background:var(--ok-soft); color:var(--ok); }
  .item .bar i { background:var(--ink); }
  .side .note { border-radius:999px; background:var(--hover); color:var(--ink-2); }

  /* top bar: breadcrumb pill */
  .topbar { background:transparent; border-bottom:0; height:60px; padding:0 28px; }
  .topbar .title { font-size:12.5px; font-weight:500; color:var(--ink); border:1px solid var(--line-2); background:var(--paper); border-radius:999px; padding:4px 12px; max-width:52%; }
  .topbar .title::before { content:"Aroa  /  "; color:var(--muted); white-space:pre; }
  .topbar .sub { font-family:var(--mono); font-size:11.5px; }
  .topbar .matter input { border-radius:999px; height:30px; background:var(--paper); }
  .pill { border-radius:999px; background:var(--paper); border:1px solid var(--line-2); color:var(--ink-2); height:26px; }
  .pill.err { background:var(--paper); color:var(--bad); border-color:var(--line-2); } .pill.warn { background:var(--paper); color:var(--warn); } .pill.ok { background:var(--paper); color:var(--ok); } .pill.plain { background:var(--paper); }
  .toolbar { background:transparent; border-bottom:0; padding:4px 28px 10px; }
  .toolbar .name { background:var(--paper); border:1px solid var(--line); border-radius:999px; padding:4px 12px; }

  /* chat */
  #log { padding:12px 28px 8px; }
  .column { max-width:760px; }
  .msg.user .bubble { background:var(--accent); color:var(--accent-ink); border:0; border-radius:18px 18px 6px 18px; box-shadow:none; padding:9px 15px; }
  .msg.ai .av { border-radius:50%; background:var(--accent); font:600 13px/1 var(--ui); width:28px; height:28px; }
  .tag { border-radius:999px; border:1px solid var(--line-2); background:var(--paper); color:var(--ink-2); font-size:10px; letter-spacing:.04em; padding:1px 8px; }
  .tag.ok { color:var(--ok); background:var(--paper); } .tag.ok::before, .tag.fail::before, .tag.blocked::before { content:"●"; font-size:8px; margin-right:5px; vertical-align:1px; }
  .tag.fail { color:var(--hot); background:var(--paper); } .tag.blocked { color:var(--bad); background:var(--paper); }
  .body blockquote { font-family:var(--ui); font-size:13.5px; background:var(--bg); border-left:2px solid var(--line-2); border-radius:0 10px 10px 0; }

  .question-card .lbl { color:var(--hot); }
  .att { border-radius:999px; }

  /* papers and page headers */
  .scrollv { padding:0 28px; }
  .paper { border-radius:16px; border-color:var(--line); box-shadow:0 1px 2px rgba(17,17,19,.04); margin:4px auto 40px; }
  .paper.prose h1, .info h1, .settings h1, .procpaper h1 { font:600 28px/1.15 var(--ui); letter-spacing:-.03em; margin:0 0 6px; }
  .paper.prose h2 { color:var(--muted); font-size:11px; letter-spacing:.08em; }

  .info, .info p, .info li { font-family:var(--ui); }

  /* review */

  .rv .scrollv { padding-right:14px; }

  .issue::before { content:""; position:absolute; left:8px; top:14px; width:6px; height:6px; border-radius:50%; background:var(--hot); }
  .issue.err::before { background:var(--bad); }
  .issue .num { color:var(--muted); }
  .issue .chg { color:var(--ink); font-weight:500; }
  .issue .acts button { border-radius:999px; }
  .issue.accept { background:var(--ok-soft); }
  .paper mark.iss { background:var(--hot-soft); border-bottom-color:var(--hot); } .paper mark.iss.err { background:var(--bad-soft); border-bottom-color:var(--bad); }
  .rv .issues .check { border-radius:14px; }

  /* inspector, popovers, toast */
  .inspector { background:var(--paper); }
  .inspector .ib { font-family:var(--ui); font-size:13.5px; }
  .pop { border-radius:16px; left:74px; }
  .pop .tile { border-radius:12px; background:var(--bg); border-color:transparent; }
  .toast { background:var(--ink); color:var(--bg); }

    .replace(/\[((?:m?\d+)(?:\s*,\s*m?\d+)*)\]/g, (_, list) => list.split(/\s*,\s*/).map(n => `<button type="button" class="cite" data-n="${n}">[${n}]</button>`).join(''))

  if (k === 'blocked') return `<span class="tag blocked">${T('k_blocked')}</span>`;
  if (k === 'question') return `<span class="tag question">${T('k_question')}</span>`;
  if (k === 'abstain') return `<span class="tag">${T('k_abstain')}</span>`;
  let tag = k ? `<span class="tag">${esc(T('kinds')[k] || k)}</span>` : '';
  if (m.verified === true) tag += `<span class="tag ok">${T('k_verified')}</span>`;
  if (m.verified === false) tag += `<span class="tag fail">${T('k_unverified')}</span>`;
  return tag;
}

const BAD_STEP = /blocked|unproven|problems|FAILED|None of|Bloqueado|sin probar|Problemas|FALLÓ|Ninguno|no existe|not appear|no aparece/i;

    (summary ? `<div class="sm">${esc(summary)}</div>` : '') + (items && items.length ? `<ul class="its">${items.map(i => `<li>${esc(i)}</li>`).join('')}</ul>` : '') + `</div></div>`;

    `<span><b>${fmt(t.input_tokens)}</b> in · <b>${fmt(t.output_tokens)}</b> out</span><span><b>${t.tool_calls}</b> ${T('tools')}</span>` +
    (t.claims ? `<span>${T('claims')} <b>${t.claims - t.claims_failed}/${t.claims}</b></span>` : '') + (t.facts_written ? `<span><b>${t.facts_written}</b> ${T('facts_stored')}</span>` : '') + '</div>';
  html += `<div class="steps done">${(t.trace || []).map(s => stepRow(s.step, s.title, s.summary, s.items, false, t.nodes && t.nodes[s.step] != null ? t.nodes[s.step] : null)).join('')}</div>`;

  if (a.memory_writes && a.memory_writes.length) html += `<div class="step audit"><div class="st">${T('audit_memory')}</div><ul class="items">` + a.memory_writes.map(w => `<li>${w.stored ? T('stored') : T('duplicate')} · ${esc(w.text)}</li>`).join('') + '</ul></div>';

async function send(text) {

  const keep = ready.filter(a => a.keep);

  addUser(text + ready.map(a => `\n\n<attachment name="${a.name.replace(/"/g, "'")}">\n`).join(''));
  for (const a of keep) indexFile(a.file);
  const live = addLive(), crumbs = live.querySelector('.crumbs'), body = live.querySelector('.body'), stepsBox = live.querySelector('.steps');
  let tokens = '', steps = []; const t0 = Date.now();
  try {
    const payload = { text, matter: $('#matter').value.trim(), attachments: ready.map(a => ({ name: a.name, text: a.text })), documents: [...selected] };
    const res = await fetch(`/api/threads/${thread}/messages`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
    const reader = res.body.getReader(); const dec = new TextDecoder(); let buf = '';

        if (ev === 'start') { crumbs.innerHTML = `<span>${esc(data.title)}…</span>`; stepStart(stepsBox, data); }
        if (ev === 'node') { steps.push(data); stepDone(stepsBox, data); }
        if (ev === 'done') {

            : addAssistant(data.reply, { kind: data.kind, turn_id: data.turn_id, verified: data.extras && data.extras.verified, sources: data.extras && data.extras.sources });
          const box = el.querySelector('.path');  // what you just watched stays one click away, no fetch needed
          if (box && steps.length) { box.innerHTML = `<div class="steps done">${steps.map(e => stepRow(e.step, e.title, e.summary, e.items, false)).join('')}</div>`; box.dataset.prefilled = '1'; const b = el.querySelector('[data-path]'); if (b) b.insertAdjacentHTML('beforeend', ` <small>${T('steps_n').replace('{n}', steps.length).replace('{s}', ((Date.now() - t0) / 1000).toFixed(1))}</small>`); }
        }

function indexFile(file) {

    li.innerHTML = `<div class="ic">${ico('doc')}</div><div class="tx"><div class="t">${esc(file.name)}</div><div class="m"><span class="st">${T('uploading')} 0%</span></div><div class="bar"><i></i></div></div>`;
    $('#uploads').appendChild(li);

    const xhr = new XMLHttpRequest();

    xhr.onload = () => {

function pretty(html) {
  // escaped text with <mark>s: headings, bold and quotes shown as such, the words untouched
  return html.split('\n').map(line => {
    let m;

    if ((m = /^&gt; ?(.*)$/.exec(line))) return `<span class="mq">${m[1]}</span>`;
    return line;

}
function highlight(text, quote) {

  const idx = text.replace(/\s+/g, ' ').indexOf(probe);
  if (idx < 0) return html;
  let i = 0, j = 0; const txt = text;
  while (j < idx && i < txt.length) { if (/\s/.test(txt[i]) && i > 0 && /\s/.test(txt[i - 1])) { i++; continue; } i++; j++; }

  let end = i, k = 0; while (end < txt.length && k < needle.length) { if (!(/\s/.test(txt[end]) && end > 0 && /\s/.test(txt[end - 1]))) k++; end++; }

}

function applyProvider(prov) {

function settingsPayload() {

$('#settings-body').addEventListener('click', async e => {

/* ── memory page ───────────────────────────────────────── */
let factsCache = [];
async function renderMemory() {
  const body = $('#memory-body');
  body.innerHTML = `<h1>${T('memory_title')}</h1><p class="lead">${esc(T('mem_intro'))}</p><div class="filter" style="margin:0 0 12px"><input id="f-mem" placeholder="${T('mem_filter')}" style="width:100%;height:34px;border:1px solid var(--line-2);border-radius:8px;padding:0 12px;background:var(--panel);color:var(--ink)"></div><div id="mem-list"><div class="live"><div class="spinner"></div></div></div>`;
  $('#f-mem').addEventListener('input', renderFacts);
  try { factsCache = await (await fetch('/api/memory/facts')).json(); } catch { factsCache = []; }
  renderFacts();
}
function renderFacts() {
  const q = ($('#f-mem')?.value || '').toLowerCase(), I = INFO[loc()] || INFO.en;
  const rows = factsCache.filter(f => !q || f.text.toLowerCase().includes(q) || (f.matter || '').toLowerCase().includes(q));
  $('#mem-list').innerHTML = rows.length ? rows.map(f => `<div class="mem"><div>${esc(f.text)}<small>${esc((f.ts || '').slice(0, 10))} · ${f.matter ? esc(f.matter) : T('mem_general')}${f.origin ? ' · ' + esc(f.origin) : ''}</small></div><button type="button" class="btn sm" data-forget="${esc(f.text)}">${ico('trash')}${I.forget}</button></div>`).join('') : `<p>${I.none}</p>`;
}
$('#memory-body').addEventListener('click', async e => {
  const b = e.target.closest('[data-forget]'); if (!b) return;
  if (!confirm(T('forget_q'))) return;
  const r = await fetch('/api/memory/forget', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text: b.dataset.forget }) });
  toast(r.ok ? T('forgotten') : T('not_removed')); if (r.ok) { factsCache = factsCache.filter(f => f.text !== b.dataset.forget); renderFacts(); loadHealth(); }
});

/* ── popovers: alarms and status ───────────────────────── */
function togglePop(id) { const el = $(id), open = el.classList.contains('open'); $$('.pop').forEach(p => p.classList.remove('open')); if (!open) el.classList.add('open'); return !open; }
document.addEventListener('click', e => { if (!e.target.closest('.pop') && !e.target.closest('#b-alarms') && !e.target.closest('#b-status')) $$('.pop').forEach(p => p.classList.remove('open')); });
$('#b-alarms').onclick = async () => {
  if (!togglePop('#pop-alarms')) return;
  const rows = await (await fetch('/api/alarms')).json();
  $('#pop-alarms').innerHTML = `<h4>${ico('bell')}${T('pending_alarms')}<span class="sp"></span><a href="/api/alarms" target="_blank" class="btn ghost sm icon">${ico('ext')}</a></h4>` +
    (rows.length ? rows.map(a => `<div class="alarm">${esc(a.text)}<small>${esc(a.due_ts || a.due || a.fire_ts || '')}</small></div>`).join('') : `<div class="empty">${T('no_alarms')}</div>`);
};
$('#b-status').onclick = async () => {
  if (!togglePop('#pop-status')) return;
  const el = $('#pop-status'); el.innerHTML = `<h4>${ico('pulse')}${T('status')}</h4>`;
  try {
    const [h, r] = await Promise.all([(await fetch('/api/health')).json(), (await fetch('/api/report?days=1')).json()]);
    const claims = r.claims_checked ? `${r.claims_checked - r.claims_failed}/${r.claims_checked}` : '–';
    el.innerHTML += `<div class="tiles">${[[r.turns, T('turns')], [r.latency_p50 + ' s', T('p50')], [r.llm_calls, T('model_calls')], [claims, T('claims_ok')], [r.facts_written, T('facts')], [`${r.feedback.up} / ${r.feedback.down}`, T('up_down')]].map(([v, l]) => `<div class="tile"><b>${esc(v)}</b><span>${l}</span></div>`).join('')}</div>` +
      `<div class="row"><span>${T('model')}</span><b>${esc(h.model)}</b></div><div class="row"><span>${T('privacy')}</span><b>${esc(h.privacy_mode)}</b></div>` +
      `<div class="row"><span>${T('memory')}</span><b>${h.memory.facts} ${T('facts')} · ${h.memory.documents} ${T('chunks')}</b></div><div class="row"><span>Tracing</span><b>${h.traced ? T('traced') : T('no_tracing')}</b></div>` +
      `<div class="links"><a href="/api/report?days=7" target="_blank">${T('report_link')}</a><a href="/metrics" target="_blank">${T('metrics_link')}</a></div>`;
  } catch { el.innerHTML += `<div class="empty">${T('unreachable')}</div>`; }
};
async function loadHealth() {
  try {
    const h = await (await fetch('/api/health')).json();
    if (!lang) { lang = h.language === 'es' ? 'es' : 'en'; applyLang(); return; }
    $('#health-dot').classList.remove('bad'); $('#b-status').title = `${esc(h.model)} · ${T('privacy')} ${h.privacy_mode}`;
  } catch { $('#health-dot').classList.add('bad'); $('#b-status').title = T('unreachable'); }
}
async function loadAlarmCount() { try { const rows = await (await fetch('/api/alarms')).json(); $('#alarms-badge').hidden = !rows.length; $('#alarms-badge').textContent = rows.length; } catch {} }

/* ── boot ──────────────────────────────────────────────── */
async function refreshThread() {  // alarms post into the thread on their own; re-render only when something new arrived
  if (section !== 'chat' || !thread || busy || column.querySelector('.welcome')) return;
  const r = await fetch('/api/threads/' + thread); if (!r.ok) return;
  const data = await r.json();
  if (data.messages.length !== column.querySelectorAll('.msg').length) openThread(thread);
}
setInterval(refreshThread, 20000);
setInterval(loadAlarmCount, 30000);
const deepJob = /^#job=([\w-]+)$/.exec(location.hash), deepDoc = /^#doc=(.+)$/.exec(location.hash), deepProc = /^#proc=(.+)$/.exec(location.hash), deep = /^#t=([\w-]+)$/.exec(location.hash);
thread = deep ? deep[1] : id();
if (lang) applyLang(); else loadHealth();
loadDocs().then(() => {
  if (deepJob) fetch('/api/jobs/' + deepJob[1]).then(r => r.ok ? r.json() : null).then(j => { if (j && j.status === 'done') openJob(j); else show('jobs'); });
  else if (deepDoc) openDoc(decodeURIComponent(deepDoc[1]));
  else if (deepProc) loadProcs().then(() => openProc(decodeURIComponent(deepProc[1])));
  else if (deep) openThread(deep[1]);
  else { showWelcome(); loadThreads().then(setTitle); }
});
if (!deep && !deepJob && !deepDoc && !deepProc) showWelcome();
loadThreads(); loadJobs(); loadAlarmCount();  // the lists load whatever the page opened on
</script>
