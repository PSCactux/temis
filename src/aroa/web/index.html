<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Aroa</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231f5c4a'/%3E%3Ctext x='16' y='22' font-family='Georgia,serif' font-size='19' font-weight='700' fill='%23fff' text-anchor='middle'%3EA%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --bg:#f1f0eb; --panel:#f8f7f3; --paper:#ffffff; --line:#e3e0d8; --line-2:#cfcbc0; --hover:#ecebe5;
    --ink:#1c1b18; --ink-2:#4a4843; --muted:#7b7872;
    --accent:#1f5c4a; --accent-ink:#ffffff; --accent-soft:#e1ede7; --accent-line:#b9d4c8;
    --warn:#9a5b00; --warn-soft:#fbf1dd; --bad:#9b2c2c; --bad-soft:#f9e4e4; --ok:#2f7a47; --ok-soft:#e3f1e7; --mark:#fff1a8;
    --shadow:0 8px 28px rgba(20,20,15,.10), 0 1px 3px rgba(20,20,15,.06);
    --ui:-apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif;
    --serif:"Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, "Times New Roman", serif;
    --mono:ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --rail:72px; --side:280px; --r:10px;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg:#151717; --panel:#1b1e1e; --paper:#1f2222; --line:#2b2f2f; --line-2:#3a3f3f; --hover:#242828;
    --ink:#ebeae6; --ink-2:#bdbcb6; --muted:#8a8984;
    --accent:#86c3ab; --accent-ink:#0f1f1a; --accent-soft:#1e2f29; --accent-line:#2f4a40;
    --warn:#e0a650; --warn-soft:#2d2415; --bad:#e58585; --bad-soft:#331c1c; --ok:#86cc97; --ok-soft:#1d2e22; --mark:#5a4d12;
    --shadow:0 10px 30px rgba(0,0,0,.45), 0 1px 3px rgba(0,0,0,.4);
  } }
  :root[data-theme="dark"] {
    --bg:#151717; --panel:#1b1e1e; --paper:#1f2222; --line:#2b2f2f; --line-2:#3a3f3f; --hover:#242828;
    --ink:#ebeae6; --ink-2:#bdbcb6; --muted:#8a8984;
    --accent:#86c3ab; --accent-ink:#0f1f1a; --accent-soft:#1e2f29; --accent-line:#2f4a40;
    --warn:#e0a650; --warn-soft:#2d2415; --bad:#e58585; --bad-soft:#331c1c; --ok:#86cc97; --ok-soft:#1d2e22; --mark:#5a4d12;
    --shadow:0 10px 30px rgba(0,0,0,.45), 0 1px 3px rgba(0,0,0,.4);
  }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; font:13.5px/1.5 var(--ui); color:var(--ink); background:var(--bg); display:grid; grid-template-columns:var(--rail) var(--side) 1fr; overflow:hidden; -webkit-font-smoothing:antialiased; }
  button, input, textarea { font:inherit; color:inherit; }
  button { cursor:pointer; }
  a { color:var(--accent); }
  ::selection { background:var(--accent-soft); }
  svg.i { width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; flex:none; }
  [hidden] { display:none !important; }

  /* ── buttons ── */
  .btn { display:inline-flex; align-items:center; gap:7px; height:32px; padding:0 12px; border-radius:8px; border:1px solid var(--line-2); background:var(--paper); color:var(--ink); font-weight:500; white-space:nowrap; }
  .btn:hover { background:var(--hover); }
  .btn.primary { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
  .btn.primary:hover { filter:brightness(1.06); }
  .btn.ghost { border-color:transparent; background:transparent; color:var(--ink-2); }
  .btn.ghost:hover { background:var(--hover); color:var(--ink); }
  .btn.sm { height:26px; padding:0 9px; font-size:12.5px; border-radius:7px; }
  .btn.icon { width:32px; padding:0; justify-content:center; }
  .btn.sm.icon { width:26px; }
  .btn:disabled { opacity:.5; cursor:default; }
  .btn.danger:hover { color:var(--bad); background:var(--bad-soft); }

  /* ── rail ── */
  .rail { background:var(--panel); border-right:1px solid var(--line); display:flex; flex-direction:column; align-items:center; padding:12px 0 10px; gap:4px; }
  .rail .brand { width:36px; height:36px; border-radius:9px; background:var(--accent); color:var(--accent-ink); display:grid; place-items:center; font:700 19px/1 var(--serif); margin-bottom:12px; }
  .rail button { width:60px; height:54px; border:0; background:transparent; border-radius:10px; color:var(--muted); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; font-size:10px; font-weight:500; letter-spacing:.01em; position:relative; }
  .rail button svg.i { width:20px; height:20px; }
  .rail button:hover { background:var(--hover); color:var(--ink); }
  .rail button.active { background:var(--accent-soft); color:var(--accent); }
  .rail .grow { flex:1; }
  .rail .badge { position:absolute; top:6px; right:10px; min-width:16px; height:16px; border-radius:8px; background:var(--accent); color:var(--accent-ink); font-size:10px; line-height:16px; text-align:center; padding:0 4px; }
  .rail .dot { position:absolute; top:9px; right:16px; width:7px; height:7px; border-radius:50%; background:var(--ok); }
  .rail .dot.bad { background:var(--bad); }

  /* ── side panel ── */
  .side { background:var(--panel); border-right:1px solid var(--line); display:flex; flex-direction:column; min-width:0; }
  .side .sh { display:flex; align-items:center; gap:8px; padding:16px 14px 8px; }
  .side .sh h2 { margin:0; font-size:15px; font-weight:600; flex:1; letter-spacing:-.01em; }
  .side .filter { margin:4px 12px 8px; position:relative; }
  .side .filter input { width:100%; height:32px; border:1px solid var(--line); border-radius:8px; background:var(--paper); padding:0 10px 0 32px; outline:none; }
  .side .filter input:focus { border-color:var(--accent-line); box-shadow:0 0 0 3px var(--accent-soft); }
  .side .filter svg.i { position:absolute; left:10px; top:7px; width:16px; height:16px; color:var(--muted); }
  .side .list { flex:1; overflow:auto; padding:0 8px 12px; }
  .side .empty { padding:24px 16px; color:var(--muted); font-size:12.5px; text-align:center; line-height:1.5; }
  .side .sec { padding:12px 8px 4px; font-size:11px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); }
  .item { display:flex; gap:10px; align-items:flex-start; padding:9px 10px; border-radius:8px; cursor:pointer; position:relative; }
  .item:hover { background:var(--hover); }
  .item.active { background:var(--paper); box-shadow:inset 0 0 0 1px var(--line); }
  .item .ic { width:28px; height:28px; border-radius:7px; background:var(--accent-soft); color:var(--accent); display:grid; place-items:center; flex:none; margin-top:1px; }
  .item .ic svg.i { width:15px; height:15px; }
  .item .ic.warn { background:var(--warn-soft); color:var(--warn); }
  .item .ic.bad { background:var(--bad-soft); color:var(--bad); }
  .item .ic.ok { background:var(--ok-soft); color:var(--ok); }
  .item .tx { flex:1; min-width:0; }
  .item .t { font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .item .m { display:flex; gap:6px; align-items:center; color:var(--muted); font-size:11.5px; margin-top:2px; white-space:nowrap; overflow:hidden; }
  .item .m .chip { font-family:var(--mono); font-size:10.5px; background:var(--accent-soft); color:var(--accent); padding:0 6px; border-radius:5px; }
  .item input[type=checkbox] { margin:7px 0 0; accent-color:var(--accent); flex:none; }
  .item .bar { height:3px; border-radius:2px; background:var(--line); margin-top:6px; overflow:hidden; }
  .item .bar i { display:block; height:100%; width:0; background:var(--accent); transition:width .3s; }
  .item .bar.busy i { width:35%; animation:slide 1.2s infinite ease-in-out; }
  @keyframes slide { 0% { margin-left:-35%; } 100% { margin-left:100%; } }
  .side .note { margin:0 12px 8px; padding:8px 10px; border-radius:8px; background:var(--accent-soft); color:var(--accent); font-size:12px; display:flex; align-items:center; gap:8px; }
  .side .note button { margin-left:auto; border:0; background:transparent; color:inherit; font-weight:600; font-size:12px; }

  /* ── work area ── */
  .work { display:flex; flex-direction:column; min-width:0; min-height:0; position:relative; }
  .topbar { height:52px; display:flex; align-items:center; gap:10px; padding:0 18px; border-bottom:1px solid var(--line); background:var(--panel); flex:none; }
  .topbar .title { font-weight:600; font-size:14.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; letter-spacing:-.01em; }
  .topbar .sub { color:var(--muted); font-size:12px; white-space:nowrap; overflow:hidden; text-outline:none; text-overflow:ellipsis; }
  .topbar .sp { flex:1; }
  .topbar .matter { display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--muted); }
  .topbar .matter input { width:130px; height:30px; border:1px solid var(--line-2); border-radius:7px; background:var(--paper); padding:0 9px; font-family:var(--mono); font-size:12px; outline:none; }
  .topbar .matter input:focus { border-color:var(--accent-line); box-shadow:0 0 0 3px var(--accent-soft); }
  .pill { display:inline-flex; align-items:center; gap:6px; height:26px; padding:0 10px; border-radius:13px; font-size:12px; background:var(--accent-soft); color:var(--accent); font-weight:500; }
  .pill button { border:0; background:transparent; color:inherit; padding:0; display:flex; }
  .pill.err { background:var(--bad-soft); color:var(--bad); } .pill.warn { background:var(--warn-soft); color:var(--warn); } .pill.ok { background:var(--ok-soft); color:var(--ok); } .pill.plain { background:var(--hover); color:var(--ink-2); }
  #menu { display:none; }
  .stage { flex:1; display:flex; min-height:0; }
  .view { flex:1; min-width:0; min-height:0; display:flex; flex-direction:column; }
  .center { flex:1; display:grid; place-items:center; padding:40px; }
  .empty-state { max-width:420px; text-align:center; color:var(--muted); }
  .empty-state .ic { width:48px; height:48px; border-radius:12px; background:var(--accent-soft); color:var(--accent); display:grid; place-items:center; margin:0 auto 14px; }
  .empty-state .ic svg.i { width:22px; height:22px; }
  .empty-state h3 { margin:0 0 6px; color:var(--ink); font-size:16px; font-weight:600; }
  .empty-state p { margin:0 0 16px; font-size:13px; line-height:1.55; }

  /* ── chat ── */
  #log { flex:1; overflow:auto; padding:28px 24px 8px; }
  .column { max-width:780px; margin:0 auto; }
  .msg { margin:0 0 22px; }
  .msg.user { display:flex; justify-content:flex-end; }
  .msg.user .bubble { max-width:78%; background:var(--paper); border:1px solid var(--line); border-radius:14px 14px 4px 14px; padding:10px 14px; white-space:pre-wrap; overflow-wrap:anywhere; box-shadow:0 1px 2px rgba(0,0,0,.04); }
  .msg.notice { display:flex; justify-content:center; }
  .msg.notice .bubble { background:var(--warn-soft); color:var(--warn); border-radius:10px; padding:8px 14px; font-size:13px; display:flex; gap:8px; align-items:center; }
  .msg .files { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .msg .file { display:inline-flex; align-items:center; gap:5px; font-size:12px; background:var(--hover); border-radius:6px; padding:3px 8px; }
  .msg.ai { display:grid; grid-template-columns:30px 1fr; gap:12px; }
  .msg.ai .av { width:30px; height:30px; border-radius:8px; background:var(--accent); color:var(--accent-ink); display:grid; place-items:center; font:700 15px/1 var(--serif); margin-top:2px; }
  .msg.ai .head { display:flex; align-items:center; gap:8px; margin-bottom:4px; font-size:12.5px; color:var(--muted); flex-wrap:wrap; }
  .msg.ai .head b { color:var(--ink); font-weight:600; }
  .tag { font-size:10.5px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; padding:2px 7px; border-radius:5px; background:var(--hover); color:var(--ink-2); }
  .tag.ok { background:var(--ok-soft); color:var(--ok); } .tag.fail { background:var(--warn-soft); color:var(--warn); } .tag.blocked { background:var(--bad-soft); color:var(--bad); } .tag.question { background:var(--accent-soft); color:var(--accent); }
  .body { font-size:14.5px; line-height:1.6; overflow-wrap:anywhere; }
  .body p { margin:0 0 10px; } .body p:last-child { margin-bottom:0; }
  .body h3 { font-size:12px; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); margin:16px 0 6px; font-weight:600; }
  .body ul, .body ol { margin:4px 0 10px; padding-left:22px; } .body li { margin:3px 0; }
  .body blockquote { margin:4px 0 10px; padding:6px 12px; border-left:3px solid var(--accent-line); background:var(--panel); border-radius:0 8px 8px 0; color:var(--ink-2); font-family:var(--serif); font-size:14px; }
  .body code { font-family:var(--mono); font-size:12.5px; background:var(--hover); padding:1px 5px; border-radius:4px; }
  .body pre { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px 12px; overflow:auto; }
  .body pre code { background:none; padding:0; }
  .cite { font-family:var(--mono); font-size:11.5px; font-weight:600; color:var(--accent); background:transparent; border:0; padding:0 3px; border-radius:4px; cursor:default; }
  .cite.link { cursor:pointer; background:var(--accent-soft); }
  .cite.link:hover { text-decoration:underline; }
  .question-card { border:1px solid var(--accent-line); background:var(--accent-soft); border-radius:10px; padding:10px 14px; }
  .question-card .lbl { font-size:11px; font-weight:600; letter-spacing:.07em; text-transform:uppercase; color:var(--accent); margin-bottom:4px; }
  .actions { display:flex; align-items:center; gap:2px; margin-top:8px; opacity:.55; transition:opacity .15s; }
  .msg.ai:hover .actions { opacity:1; }
  .actions .btn.on { color:var(--accent); background:var(--accent-soft); }
  .live { display:flex; align-items:center; gap:10px; color:var(--muted); font-size:12.5px; margin:4px 0 8px; }
  .crumbs { display:flex; gap:6px; flex-wrap:wrap; }
  .crumbs span { background:var(--hover); border-radius:5px; padding:2px 8px; }
  .spinner { width:14px; height:14px; border:2px solid var(--line-2); border-top-color:var(--accent); border-radius:50%; animation:spin .8s linear infinite; flex:none; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .path { display:none; margin-top:8px; border:1px solid var(--line); border-radius:10px; background:var(--panel); padding:10px 14px; font-size:12.5px; }
  .path.open { display:block; }
  .path .sum { display:flex; flex-wrap:wrap; gap:6px 16px; color:var(--muted); padding-bottom:8px; border-bottom:1px solid var(--line); margin-bottom:6px; }
  .path .sum b { color:var(--ink); }
  .path .step { padding:6px 0 6px 14px; border-left:2px solid var(--line-2); margin-left:4px; }
  .path .step.bad { border-left-color:var(--warn); }
  .path .step.audit { border-left-color:var(--accent-line); }
  .path .st { font-weight:600; display:flex; gap:8px; align-items:baseline; } .path .st small { color:var(--muted); font-weight:400; font-family:var(--mono); }
  .path .sm { color:var(--ink-2); }
  .path .items { margin:4px 0 0; padding-left:16px; color:var(--ink-2); font-family:var(--mono); font-size:11.5px; }
  .welcome { padding:40px 0 20px; }
  .welcome h2 { font:600 26px/1.2 var(--serif); letter-spacing:-.01em; margin:0 0 8px; text-align:center; }
  .welcome p { margin:0 auto 22px; color:var(--muted); text-align:center; max-width:520px; }
  .suggest { display:grid; grid-template-columns:repeat(3, 1fr); gap:10px; }
  .suggest button { text-align:left; background:var(--paper); border:1px solid var(--line); border-radius:12px; padding:12px 14px; line-height:1.45; color:var(--ink-2); transition:border-color .15s, transform .15s; }
  .suggest button:hover { border-color:var(--accent-line); color:var(--ink); transform:translateY(-1px); }
  .suggest b { display:block; font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--accent); margin-bottom:5px; }
  .composer { padding:8px 24px 16px; flex:none; }
  .composer form { max-width:780px; margin:0 auto; background:var(--paper); border:1px solid var(--line-2); border-radius:14px; box-shadow:0 1px 2px rgba(0,0,0,.04); transition:border-color .15s, box-shadow .15s; }
  .composer form:focus-within { border-color:var(--accent-line); box-shadow:0 0 0 3px var(--accent-soft); }
  .composer .atts { display:flex; flex-wrap:wrap; gap:6px; padding:10px 12px 0; }
  .composer .atts:empty { display:none; }
  .att { display:inline-flex; align-items:center; gap:8px; max-width:100%; font-size:12.5px; padding:5px 6px 5px 10px; border-radius:8px; background:var(--panel); border:1px solid var(--line); }
  .att .nm { max-width:200px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-weight:500; }
  .att .sz { color:var(--muted); font-size:11.5px; }
  .att label { display:inline-flex; align-items:center; gap:4px; color:var(--ink-2); cursor:pointer; font-size:12px; }
  .att input[type=checkbox] { accent-color:var(--accent); margin:0; }
  .composer .line { display:flex; align-items:flex-end; gap:6px; padding:8px 8px 8px 10px; }
  .composer textarea { flex:1; border:0; outline:0; background:transparent; resize:none; max-height:200px; padding:7px 4px; font-size:14.5px; line-height:1.45; }
  .composer .send { width:34px; height:34px; border-radius:9px; border:0; background:var(--accent); color:var(--accent-ink); display:grid; place-items:center; }
  .composer .send:disabled { opacity:.45; }
  .hint { max-width:780px; margin:8px auto 0; font-size:11.5px; color:var(--muted); text-align:center; }

  /* ── paper (documents, drafts, reports) ── */
  .scrollv { flex:1; overflow:auto; min-height:0; }
  .paper { max-width:820px; margin:24px auto 48px; background:var(--paper); border:1px solid var(--line); border-radius:12px; padding:40px 48px; font-family:var(--serif); font-size:15px; line-height:1.7; white-space:pre-wrap; overflow-wrap:anywhere; box-shadow:0 1px 2px rgba(0,0,0,.04); }
  .paper.prose { white-space:normal; }
  .paper.prose h1 { font-size:22px; margin:0 0 14px; font-weight:600; letter-spacing:-.01em; }
  .paper.prose h2 { font-family:var(--ui); font-size:11.5px; letter-spacing:.09em; text-transform:uppercase; color:var(--accent); margin:26px 0 8px; font-weight:600; }
  .paper.prose h3 { font-family:var(--ui); font-size:12px; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); margin:18px 0 6px; }
  .paper.prose p { margin:0 0 10px; }
  .paper.prose ul { padding-left:20px; } .paper.prose li { margin:6px 0; }
  .paper.prose blockquote { margin:4px 0 10px; padding:4px 12px; border-left:3px solid var(--accent-line); color:var(--ink-2); font-size:14px; }
  .paper.prose .cite { font-size:11.5px; }
  .mh { display:block; font-weight:600; letter-spacing:-.01em; } .mh1 { font-size:22px; line-height:1.3; } .mh2 { font-size:17px; } .mh3 { font-size:15.5px; }
  .mq { display:block; padding-left:12px; border-left:3px solid var(--accent-line); color:var(--ink-2); font-style:italic; }
  .paper mark { background:var(--mark); color:inherit; border-radius:3px; padding:1px 2px; }
  .paper mark.iss { background:var(--warn-soft); border-bottom:2px solid var(--warn); cursor:pointer; }
  .paper mark.iss.err { background:var(--bad-soft); border-bottom-color:var(--bad); }
  .paper mark.iss.focus { outline:2px solid var(--accent); outline-offset:2px; }
  .editor-wrap { flex:1; min-height:0; position:relative; display:flex; flex-direction:column; background:var(--bg); }
  body > .tox-tinymce-aux { position:absolute !important; top:0; left:0; width:0; height:0; }  /* TinyMCE's popup sink must not become a grid cell */
  .editor-wrap .tox-tinymce { flex:1; border:0 !important; border-radius:0 !important; height:auto !important; }
  .editor-wrap .tox .tox-edit-area::before { display:none; }
  .editor-wrap .tox:not(.tox-tinymce-inline) .tox-editor-header { box-shadow:none !important; border-bottom:1px solid var(--line) !important; padding:4px 12px !important; background:var(--panel) !important; }
  .editor-wrap .tox .tox-toolbar__primary { background:transparent !important; }
  .editor-wrap .tox .tox-statusbar { border-top:1px solid var(--line) !important; background:var(--panel) !important; }
  .editor-wrap .tox .tox-edit-area__iframe { background:var(--bg) !important; }
  .pop.versions { position:absolute; left:auto; right:24px; top:8px; bottom:auto; width:340px; max-height:60%; overflow:auto; }
  .pop.versions .row { align-items:center; } .pop.versions .row .acts { display:flex; gap:4px; }
  .toolbar .name { font-weight:600; color:var(--ink); font-size:13.5px; border:1px solid transparent; border-radius:6px; padding:2px 6px; width:280px; max-width:40%; background:transparent; }
  .toolbar .name:focus { outline:none; border-color:var(--accent-line); background:var(--paper); }

  /* ── inspector ── */

  .pop { position:fixed; left:80px; bottom:14px; width:320px; background:var(--paper); border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow); padding:14px 16px; z-index:50; display:none; }

  .pop .tiles { display:grid; grid-template-columns:repeat(3, 1fr); gap:6px; margin:4px 0 10px; }
  .pop .tile { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:7px 9px; }
  .pop .tile b { display:block; font-size:15px; font-weight:600; } .pop .tile span { font-size:11px; color:var(--muted); }
  .pop .links { display:flex; gap:12px; font-size:12px; margin-top:8px; }
  .pop .alarm { padding:7px 0; border-top:1px solid var(--line); font-size:12.5px; } .pop .alarm small { display:block; color:var(--muted); font-family:var(--mono); font-size:11px; }
  .pop .empty { color:var(--muted); font-size:12.5px; padding:4px 0; }

  .drop { position:absolute; inset:0; display:none; place-items:center; background:color-mix(in srgb, var(--bg) 82%, transparent); border:2px dashed var(--accent); z-index:10; font-weight:600; color:var(--accent); font-size:16px; backdrop-filter:blur(2px); }
  .work.dragging .drop { display:grid; }
  .toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:9px 16px; border-radius:999px; font-size:13px; box-shadow:var(--shadow); opacity:0; transition:opacity .2s; pointer-events:none; z-index:60; }
  .toast.show { opacity:1; }

  @media (max-width: 1100px) { .rv .issues { width:340px; } .suggest { grid-template-columns:repeat(2, 1fr); } }

    #menu { display:inline-flex; }
    .topbar { padding:0 12px; } .topbar .matter input { width:100px; }

    .rv { flex-direction:column; } .rv .issues { width:auto; border-left:0; border-top:1px solid var(--line); max-height:45%; }
    .inspector.open { position:absolute; inset:0; width:100%; z-index:5; }

  }
</style>

/* ── helpers ───────────────────────────────────────────── */
function id() { return Math.random().toString(36).slice(2, 10); }
function esc(s) { return String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
function ico(name, cls = 'i') { return `<svg class="${cls}"><use href="#i-${name}"/></svg>`; }
function ago(ts) {
  const d = (Date.now() - new Date(ts)) / 1000;
  if (d < 60) return loc() === 'es' ? 'ahora' : 'now'; if (d < 3600) return Math.round(d / 60) + ' min'; if (d < 86400) return Math.round(d / 3600) + ' h';
  return new Date(ts).toLocaleDateString(loc(), { day: 'numeric', month: 'short' });
}
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2600); }
function kchars(n) { return n >= 1000 ? (n / 1000).toFixed(1) + 'k' : String(n); }
function nthIndex(text, needle, n) { let i = -1; for (let k = 0; k < n; k++) { i = text.indexOf(needle, i + 1); if (i < 0) return -1; } return i; }

function inline(s) {
  return esc(s)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
    .replace(/(^|[\s(])_(.+?)_(?=[\s).,;:]|$)/g, '$1<i>$2</i>')
    .replace(/\[(\d+(?:\s*,\s*\d+)*)\]/g, (_, list) => list.split(/\s*,\s*/).map(n => `<button type="button" class="cite" data-n="${n}">[${n}]</button>`).join(''))
    .replace(/(https?:\/\/[^\s<)]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
}
function md(text) {
  const lines = String(text ?? '').replace(/\r/g, '').split('\n');
  let html = '', para = [], list = null, code = null;
  const flush = () => { if (para.length) { html += '<p>' + inline(para.join(' ')) + '</p>'; para = []; } if (list) { html += `</${list}>`; list = null; } };
  for (const raw of lines) {
    if (code !== null) { if (raw.startsWith('```')) { html += '<pre><code>' + esc(code.join('\n')) + '</code></pre>'; code = null; } else code.push(raw); continue; }
    const line = raw.trimEnd();
    if (line.startsWith('```')) { flush(); code = []; continue; }
    if (!line.trim()) { flush(); continue; }
    let m;
    if ((m = /^(#{1,3})\s+(.*)/.exec(line))) { flush(); const h = m[1].length === 1 ? 'h1' : m[1].length === 2 ? 'h2' : 'h3'; html += `<${h}>` + inline(m[2]) + `</${h}>`; continue; }
    if ((m = /^\s*>\s?(.*)/.exec(line))) { flush(); html += '<blockquote>' + inline(m[1]) + '</blockquote>'; continue; }
    if ((m = /^\s*[-*•]\s+(.*)/.exec(line))) { if (list !== 'ul') { flush(); list = 'ul'; html += '<ul>'; } html += '<li>' + inline(m[1]) + '</li>'; continue; }
    if ((m = /^\s*\d+[.)]\s+(.*)/.exec(line))) { if (list !== 'ol') { flush(); list = 'ol'; html += '<ol>'; } html += '<li>' + inline(m[1]) + '</li>'; continue; }
    if (list) flush();
    para.push(line);
  }
  flush();
  return html || '<p></p>';
}

/* ── chat rendering ────────────────────────────────────── */
function scrollDown() { log.scrollTop = log.scrollHeight; }
const ATTACHED = /\n\n<attachment name="([^"\n]+)">\n/g;
function addUser(text) {
  const el = document.createElement('div');
  if (text.startsWith('[Alarm due now]')) { el.className = 'msg notice'; el.innerHTML = `<div class="bubble">${ico('bell')}${esc(text.replace('[Alarm due now]', '').trim())}</div>`; }
  else {
    const names = [...text.matchAll(ATTACHED)].map(m => m[1]);
    const shown = names.length ? text.slice(0, text.search(ATTACHED)) : text;
    el.className = 'msg user';
    el.innerHTML = `<div class="bubble">${esc(shown)}${names.length ? '<div class="files">' + names.map(n => `<span class="file">${ico('doc')}${esc(n)}</span>`).join('') + '</div>' : ''}</div>`;
  }
  column.appendChild(el); scrollDown(); return el;
}
function kindTag(m) {

  if (k === 'question') return `<span class="tag question">${T('k_question')}</span>`;
  if (k === 'abstain') return `<span class="tag">${T('k_abstain')}</span>`;
  let tag = k ? `<span class="tag">${esc(T('kinds')[k] || k)}</span>` : '';

function renderPath(t) {

    `<span><b>${fmt(t.input_tokens)}</b> in · <b>${fmt(t.output_tokens)}</b> out</span><span><b>${t.tool_calls}</b> ${T('tools')}</span>` +
    (t.claims ? `<span>${T('claims')} <b>${t.claims - t.claims_failed}/${t.claims}</b></span>` : '') + (t.facts_written ? `<span><b>${t.facts_written}</b> ${T('facts_stored')}</span>` : '') + '</div>';

    html += `<div class="step${bad ? ' bad' : ''}"><div class="st">${esc(s.title)}${t.nodes && t.nodes[s.step] != null ? `<small>${t.nodes[s.step]} s</small>` : ''}</div><div class="sm">${esc(s.summary)}</div>` +
      (s.items && s.items.length ? '<ul class="items">' + s.items.map(i => `<li>${esc(i)}</li>`).join('') + '</ul>' : '') + '</div>';

  if (a.memory_writes && a.memory_writes.length) html += `<div class="step audit"><div class="st">${T('audit_memory')}</div><ul class="items">` + a.memory_writes.map(w => `<li>${w.stored ? T('stored') : T('duplicate')} · ${esc(w.text)}</li>`).join('') + '</ul></div>';

column.addEventListener('click', async e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.q) { $('#text').value = b.dataset.q; $('#form').requestSubmit(); return; }
  if (b.classList.contains('cite')) {
    const sources = JSON.parse(b.closest('.answer')?.dataset.sources || '[]');
    const s = sources.find(x => x.n === +b.dataset.n);
    if (s) openInspector(s.file, s.quote); return;
  }
  if (b.dataset.edit) { const text = b.closest('.answer').querySelector('.body').innerHTML; openEditor(null, text.replace(/<button[^>]*class="cite[^"]*"[^>]*>(\[\d+\])<\/button>/g, '$1').replace(/<h3>/g, '<h2>').replace(/<\/h3>/g, '</h2>'), ''); return; }

    const res = await fetch(`/api/threads/${thread}/messages`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });

}

function closeEditorSilently() { if (editing && editing.dirty && !confirm(T('leave_q'))) return false; if (ed()) tinymce.remove('#editor'); $('#editor-wrap').hidden = true; $('#pop-versions').classList.remove('open'); editing = null; return true; }
function closeEditor(force) {

$('#new-doc-2').onclick = () => openEditor(null, '', '');

/* ── highlight + inspector + clippings ─────────────────── */
function pretty(html) {
  // escaped text with <mark>s: headings, bold and quotes shown as such, the words untouched
  return html.split('\n').map(line => {
    let m;
    if ((m = /^(#{1,3}) (.*)$/.exec(line))) return `<span class="mh mh${m[1].length}">${m[2]}</span>`;
    if ((m = /^&gt; ?(.*)$/.exec(line))) return `<span class="mq">${m[1]}</span>`;
    return line;
  }).join('\n').replace(/(<\/span>)\n/g, '$1').replace(/\*\*([^*\n]+?)\*\*/g, '<b>$1</b>');
}
function highlight(text, quote) {
  let html = esc(text);
  if (!quote) return html;
  const needle = quote.replace(/\s+/g, ' ').trim();
  const probe = needle.length > 60 ? needle.slice(0, 60) : needle;
  const idx = text.replace(/\s+/g, ' ').indexOf(probe);
  if (idx < 0) return html;
  let i = 0, j = 0; const txt = text;
  while (j < idx && i < txt.length) { if (/\s/.test(txt[i]) && i > 0 && /\s/.test(txt[i - 1])) { i++; continue; } i++; j++; }
  while (i < txt.length && /\s/.test(txt[i]) && i > 0 && /\s/.test(txt[i - 1])) i++;
  let end = i, k = 0; while (end < txt.length && k < needle.length) { if (!(/\s/.test(txt[end]) && end > 0 && /\s/.test(txt[end - 1]))) k++; end++; }
  return esc(txt.slice(0, i)) + '<mark id="mark">' + esc(txt.slice(i, end)) + '</mark>' + esc(txt.slice(end));
}
async function openInspector(source, quote) {
  const r = await fetch('/api/documents/' + encodeURIComponent(source) + '/text');
  if (!r.ok) { toast(T('not_removed')); return; }
  const d = await r.json(), doc = docsCache.find(x => x.source === source), body = $('#insp-body');
  $('#insp-title').innerHTML = `${esc(doc ? doc.title : source)}<small>${esc(source)}</small>`;
  body.dataset.source = source; body.innerHTML = pretty(highlight(d.text, quote));
  $('#inspector').classList.add('open');
  const m = body.querySelector('#mark'); if (m) setTimeout(() => m.scrollIntoView({ block: 'center', behavior: 'smooth' }), 220); else body.scrollTop = 0;
}
function closeInspector() { $('#inspector').classList.remove('open'); }
document.addEventListener('click', e => { if (!e.target.closest('#pop-versions') && !e.target.closest('#ed-versions')) $('#pop-versions').classList.remove('open'); });
$('#insp-close').onclick = closeInspector;

function clipButton() {
  const sel = window.getSelection(), btn = $('#clip');
  const text = sel && !sel.isCollapsed ? sel.toString().trim() : '';
  const host = text && sel.anchorNode ? (sel.anchorNode.nodeType === 1 ? sel.anchorNode : sel.anchorNode.parentElement).closest('[data-source]') : null;
  if (!text || !host) { btn.classList.remove('show'); return; }
  const rect = sel.getRangeAt(0).getBoundingClientRect();
  btn.style.left = Math.max(8, Math.min(rect.left, window.innerWidth - 180)) + 'px'; btn.style.top = (rect.bottom + 6) + 'px';
  btn.dataset.text = text; btn.dataset.source = host.dataset.source; btn.classList.add('show');
}
document.addEventListener('selectionchange', () => setTimeout(clipButton, 0));
$('#clip').addEventListener('mousedown', e => e.preventDefault());
$('#clip').onclick = async () => {
  const text = $('#clip').dataset.text, source = $('#clip').dataset.source; if (!text || !source) return;

  const r = await fetch('/api/clippings', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ source, text, note, matter: $('#matter').value.trim() }) });

/* ── jobs: reviews and analyses ────────────────────────── */
async function startAnalysis(source) {
  const goal = prompt(T('goal_prompt'), ''); if (goal === null) return;
  const r = await fetch('/api/documents/' + encodeURIComponent(source) + '/analyze', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ goal }) });
  if (!r.ok) { toast(T('analysis_failed')); return; }
  watchJob((await r.json()).job_id, 'analysis');
}
async function startReview(req) {
  const r = await fetch('/api/reviews', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ ...req, documents: [...selected], legal: true }) });
  if (!r.ok) { toast(T('review_failed')); return; }
  watchJob((await r.json()).job_id, 'review');
}
const watching = new Set();
function watchJob(job_id, kind) {
  if (watching.has(job_id)) return; watching.add(job_id);
  show('jobs'); loadJobs();
  const tick = async () => {
    const job = await (await fetch('/api/jobs/' + job_id)).json();
    const row = jobsCache.find(j => j.job_id === job_id); if (row) Object.assign(row, { status: job.status, done: job.done, total: job.total }); renderJobs();
    if (job.status === 'done') { watching.delete(job_id); toast(T(kind === 'review' ? 'review_done' : 'analysis_done')); loadJobs(); openJob(job); return; }
    if (job.status === 'failed') { watching.delete(job_id); toast(`${T(kind === 'review' ? 'review_failed' : 'analysis_failed')}: ${job.error || ''}`); loadJobs(); return; }
    setTimeout(tick, 1500);
  };
  tick();
}
async function loadJobs() {
  jobsCache = await (await fetch('/api/jobs')).json();
  renderJobs();
  const running = jobsCache.filter(j => j.status === 'queued' || j.status === 'running');
  for (const j of running) watchJob(j.job_id, j.kind);
}
function renderJobs() {
  const running = jobsCache.filter(j => j.status === 'queued' || j.status === 'running').length;
  $('#jobs-badge').hidden = !running; $('#jobs-badge').textContent = running;
  $('#jobs-empty').hidden = jobsCache.length > 0;
  $('#jobs').innerHTML = jobsCache.map(j => {
    const icon = j.kind === 'review' ? 'pen' : 'scan', live = j.status === 'queued' || j.status === 'running';
    const cls = j.status === 'failed' ? 'bad' : j.status === 'done' ? '' : 'warn';
    const state = j.status === 'done' ? ago(j.updated_ts) : j.status === 'failed' ? T('failed') : j.status === 'queued' ? T('queued') : `${T(j.kind === 'review' ? 'reviewing' : 'analyzing')}${j.total ? ` ${j.done}/${j.total}` : '…'}`;
    return `<div class="item ${currentJob && currentJob.job_id === j.job_id ? 'active' : ''}" data-job="${esc(j.job_id)}"><div class="ic ${cls}">${ico(icon)}</div><div class="tx"><div class="t">${esc(j.source)}</div>` +
      `<div class="m"><span>${j.kind === 'review' ? T('kind_review') : T('kind_analysis')}</span><span>· ${esc(state)}</span></div>` +
      (live ? `<div class="bar ${j.total ? '' : 'busy'}"><i style="width:${j.total ? Math.round(j.done / j.total * 100) : 0}%"></i></div>` : '') + `</div></div>`;
  }).join('');
}
$('#jobs').addEventListener('click', async e => {
  const it = e.target.closest('[data-job]'); if (!it) return;
  const job = await (await fetch('/api/jobs/' + it.dataset.job)).json();
  if (job.status === 'done') openJob(job); else if (job.status === 'failed') toast(job.error || T('failed'));
});
function openJob(job, keepDecisions = false) {
  show('jobs'); currentJob = job; renderJobs(); setTitle(); history.replaceState(null, '', '#job=' + job.job_id);
  $('#job-empty').hidden = true; $('#job-tools').hidden = false;
  if (job.kind === 'review') { $('#rv').hidden = false; $('#an-scroll').hidden = true; showReview(job, keepDecisions); }
  else { $('#rv').hidden = true; $('#an-scroll').hidden = false; showReport(job); }
}
function showReport(job) {
  const r = job.result, body = $('#an-body');
  $('#job-tools').innerHTML = `<span class="stats">${esc(r.title)} · ${r.chunks} ${T('chunks')} · ${r.findings.length} ${T('findings')} · ${r.seconds} s</span>` +
    `<button class="btn sm" id="an-open">${ico('doc')}${T('open_doc')}</button>`;
  $('#an-open').onclick = () => openDoc(r.source);
  body.innerHTML = md(r.report); body.dataset.sources = JSON.stringify(r.sources || []);
  body.querySelectorAll('.cite').forEach(c => { if ((r.sources || []).some(s => s.n === +c.dataset.n)) c.classList.add('link'); });
  $('#an-scroll').scrollTop = 0;
}
$('#an-body').addEventListener('click', e => {
  const b = e.target.closest('.cite'); if (!b) return;
  const s = JSON.parse($('#an-body').dataset.sources || '[]').find(x => x.n === +b.dataset.n);
  if (s) openInspector(s.file, s.quote);
});

/* ── review: issues marked on the draft, changes accepted one by one ── */
let reviewState = null;
function showReview(job, keepDecisions) {
  const r = job.result;
  if (!keepDecisions || !reviewState || reviewState.job.job_id !== job.job_id) reviewState = { job, decisions: new Map() };
  const errs = r.issues.filter(i => i.severity === 'error').length, warns = r.issues.length - errs;
  $('#job-tools').innerHTML = `<span class="pill ${errs ? 'err' : 'ok'}">${errs ? ico('alert') : ico('check')}${errs} ${T('errors')}</span><span class="pill ${warns ? 'warn' : 'plain'}">${warns} ${T('warnings')}</span>` +
    `<span class="stats">${r.paragraphs} ${T('paragraphs')} · ${r.quotes_checked} ${T('quotes_checked')} · ${r.citations_checked} ${T('citations_checked')} · ${r.seconds} s</span>` +
    `<span id="rv-count" style="white-space:nowrap"></span><button class="btn sm" id="rv-edit" title="${T('open_corrected')}">${ico('pen')}${T('edit')}</button><button class="btn sm" id="rv-copy">${ico('copy')}${T('copy_fixed')}</button><button class="btn primary sm" id="rv-download">${ico('download')}${T('download_fixed')}</button>`;
  let side = '';
  for (const n of r.notes || []) side += `<div class="rv-note">${esc(n)}</div>`;
  if (!r.issues.length) side += `<div class="rv-note ok">${T('no_issues')}</div>`;
  $('#rv-issues').innerHTML = side + r.issues.map(issueCard).join('');
  $('#rv-draft').innerHTML = pretty(markedDraft(r)); $('#rv-draft').dataset.name = r.name;
  updateCount();
}
function issueCard(i) {
  const cut = t => esc(t.length > 240 ? t.slice(0, 240) + '…' : t), d = reviewState.decisions.get(i.n) || '';
  return `<div class="issue ${i.severity === 'error' ? 'err' : 'warn'} ${d}" data-n="${i.n}">` +
    `<div class="ih"><span class="num">[${i.n}]</span><span class="kind">${esc(T('issue_kinds')[i.kind] || i.kind)}</span><span>· ${T('paragraph')} ${i.paragraph}</span></div>` +
    `<div class="why">${esc(i.reason)}</div><blockquote>«${cut(i.passage)}»</blockquote>` +
    (i.quote && i.kind !== 'articulo_equivocado' ? `<div class="orig">${T('original')}: «${cut(i.quote)}»${i.file ? ` <button type="button" class="cite link" data-open-src="${esc(i.file)}" data-q="${esc(i.quote)}">${T('open')}</button>` : ''}</div>` : '') +
    (i.source && /^https?:/.test(i.source) ? `<a class="src" href="${esc(i.source)}" target="_blank" rel="noopener">${esc(i.source.replace(/^https?:\/\//, ''))}</a>` : '') +
    (i.change ? `<div class="chg">${i.change.after === '' ? T('delete_paragraph') : '→ «' + esc(i.change.after) + '»'}</div><div class="acts"><button type="button" data-dec="accept">${ico('check')}${T('accept')}</button><button type="button" data-dec="reject">${ico('x')}${T('reject')}</button></div>` : '') + `</div>`;
}
function markedDraft(r) {
  const text = r.draft, ranges = [];
  for (const i of r.issues) { const at = nthIndex(text, i.passage, i.change ? i.change.occurrence : 1); if (at >= 0) ranges.push({ s: at, e: at + i.passage.length, i }); }
  ranges.sort((a, b) => a.s - b.s);
  let html = '', pos = 0;
  for (const g of ranges) { if (g.s < pos) continue; html += esc(text.slice(pos, g.s)) + `<mark class="iss ${g.i.severity === 'error' ? 'err' : 'warn'}" data-n="${g.i.n}" id="iss-${g.i.n}">${esc(text.slice(g.s, g.e))}</mark>`; pos = g.e; }
  return html + esc(text.slice(pos));
}
function correctedDraft(r) {
  let text = r.draft; const located = [];
  for (const i of r.issues) { if (!i.change || reviewState.decisions.get(i.n) !== 'accept') continue; const at = nthIndex(text, i.change.before, i.change.occurrence); if (at >= 0) located.push({ at, c: i.change }); }
  located.sort((a, b) => b.at - a.at);
  for (const { at, c } of located) { let end = at + c.before.length; if (c.after === '') while (end < text.length && text[end] === '\n') end++; text = text.slice(0, at) + c.after + text.slice(end); }
  return text;
}
function updateCount() { const n = [...reviewState.decisions.values()].filter(v => v === 'accept').length; const el = $('#rv-count'); if (el) el.textContent = `${n} ${T('changes')}`; }
function focusIssue(n) {
  $$('.issue.focus, mark.iss.focus').forEach(x => x.classList.remove('focus'));
  const card = $(`.issue[data-n="${n}"]`), mark = $('#iss-' + n);
  card?.classList.add('focus'); mark?.classList.add('focus');
  return { card, mark };
}
$('#rv-issues').addEventListener('click', e => {
  if (!reviewState) return;
  const dec = e.target.closest('[data-dec]');
  if (dec) { const card = dec.closest('.issue'); reviewState.decisions.set(+card.dataset.n, dec.dataset.dec); card.classList.remove('accept', 'reject'); card.classList.add(dec.dataset.dec); updateCount(); return; }
  const src = e.target.closest('[data-open-src]'); if (src) { openInspector(src.dataset.openSrc, src.dataset.q); return; }
  if (e.target.closest('a')) return;
  const card = e.target.closest('.issue'); if (card) focusIssue(+card.dataset.n).mark?.scrollIntoView({ block: 'center', behavior: 'smooth' });
});
$('#rv-draft').addEventListener('click', e => { const mark = e.target.closest('mark.iss'); if (mark) focusIssue(+mark.dataset.n).card?.scrollIntoView({ block: 'center', behavior: 'smooth' }); });
$('#job-tools').addEventListener('click', e => {
  if (!reviewState || !currentJob || currentJob.kind !== 'review') return;
  const r = reviewState.job.result;
  if (e.target.closest('#rv-download')) { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([correctedDraft(r)], { type: 'text/markdown' })); a.download = (r.name || 'borrador').replace(/\.[^.]+$/, '') + '-revisado.md'; a.click(); URL.revokeObjectURL(a.href); }
  if (e.target.closest('#rv-copy')) navigator.clipboard.writeText(correctedDraft(r)).then(() => toast(T('copied')));
  if (e.target.closest('#rv-edit')) openEditor(null, mdToHtml(correctedDraft(r)), (r.name || 'borrador').replace(/\.[^.]+$/, '') + '-revisado');
});

/* ── popovers: alarms and status ───────────────────────── */
function togglePop(id) { const el = $(id), open = el.classList.contains('open'); $$('.pop').forEach(p => p.classList.remove('open')); if (!open) el.classList.add('open'); return !open; }
document.addEventListener('click', e => { if (!e.target.closest('.pop') && !e.target.closest('#b-alarms') && !e.target.closest('#b-status')) $$('.pop').forEach(p => p.classList.remove('open')); });
$('#b-alarms').onclick = async () => {
  if (!togglePop('#pop-alarms')) return;
  const rows = await (await fetch('/api/alarms')).json();
  $('#pop-alarms').innerHTML = `<h4>${ico('bell')}${T('pending_alarms')}<span class="sp"></span><a href="/api/alarms" target="_blank" class="btn ghost sm icon">${ico('ext')}</a></h4>` +
    (rows.length ? rows.map(a => `<div class="alarm">${esc(a.text)}<small>${esc(a.due_ts || a.due || a.fire_ts || '')}</small></div>`).join('') : `<div class="empty">${T('no_alarms')}</div>`);
};
$('#b-status').onclick = async () => {
  if (!togglePop('#pop-status')) return;
  const el = $('#pop-status'); el.innerHTML = `<h4>${ico('pulse')}${T('status')}</h4>`;
  try {
    const [h, r] = await Promise.all([(await fetch('/api/health')).json(), (await fetch('/api/report?days=1')).json()]);
    const claims = r.claims_checked ? `${r.claims_checked - r.claims_failed}/${r.claims_checked}` : '–';
    el.innerHTML += `<div class="tiles">${[[r.turns, T('turns')], [r.latency_p50 + ' s', T('p50')], [r.llm_calls, T('model_calls')], [claims, T('claims_ok')], [r.facts_written, T('facts')], [`${r.feedback.up} / ${r.feedback.down}`, T('up_down')]].map(([v, l]) => `<div class="tile"><b>${esc(v)}</b><span>${l}</span></div>`).join('')}</div>` +
      `<div class="row"><span>${T('model')}</span><b>${esc(h.model)}</b></div><div class="row"><span>${T('privacy')}</span><b>${esc(h.privacy_mode)}</b></div>` +
      `<div class="row"><span>${T('memory')}</span><b>${h.memory.facts} ${T('facts')} · ${h.memory.documents} ${T('chunks')}</b></div><div class="row"><span>Tracing</span><b>${h.traced ? T('traced') : T('no_tracing')}</b></div>` +
      `<div class="links"><a href="/api/report?days=7" target="_blank">${T('report_link')}</a><a href="/metrics" target="_blank">${T('metrics_link')}</a></div>`;
  } catch { el.innerHTML += `<div class="empty">${T('unreachable')}</div>`; }
};
async function loadHealth() {
  try {
    const h = await (await fetch('/api/health')).json();
    if (!lang) { lang = h.language === 'es' ? 'es' : 'en'; applyLang(); return; }
    $('#health-dot').classList.remove('bad'); $('#b-status').title = `${esc(h.model)} · ${T('privacy')} ${h.privacy_mode}`;
  } catch { $('#health-dot').classList.add('bad'); $('#b-status').title = T('unreachable'); }
}
async function loadAlarmCount() { try { const rows = await (await fetch('/api/alarms')).json(); $('#alarms-badge').hidden = !rows.length; $('#alarms-badge').textContent = rows.length; } catch {} }

/* ── boot ──────────────────────────────────────────────── */
setInterval(() => { if (section === 'chat' && thread && !busy && !column.querySelector('.welcome')) openThread(thread); }, 20000); // alarms post into the thread on their own
setInterval(loadAlarmCount, 30000);
const deepJob = /^#job=([\w-]+)$/.exec(location.hash), deepDoc = /^#doc=(.+)$/.exec(location.hash), deep = /^#t=([\w-]+)$/.exec(location.hash);
thread = deep ? deep[1] : id();
if (lang) applyLang(); else loadHealth();
loadDocs().then(() => {
  if (deepJob) fetch('/api/jobs/' + deepJob[1]).then(r => r.ok ? r.json() : null).then(j => { if (j && j.status === 'done') openJob(j); else show('jobs'); });
  else if (deepDoc) openDoc(decodeURIComponent(deepDoc[1]));
  else if (deep) openThread(deep[1]);
  else { showWelcome(); loadThreads().then(setTitle); }
});
if (!deep && !deepJob && !deepDoc) showWelcome();
loadJobs(); loadAlarmCount();
</script>
